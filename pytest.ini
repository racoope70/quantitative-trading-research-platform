# Source: racoope70/ppo-trading-pipeline
# Commit: 072103f43d8b2488c3efca183f637ab0508a193a
# Path: pytest.ini
#
# Adapted for C1-TM-044 canonical offline verification.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    network: test requires network access and is prohibited in ordinary canonical verification
    credential: test requires credentials and is prohibited in ordinary canonical verification
    provider: test requires provider access and is prohibited in ordinary canonical verification
    training: test performs model training and is prohibited in ordinary canonical verification
    order: test performs order or broker submission behavior and is prohibited in ordinary canonical verification

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-research-platform"
version = "0.0.0"
description = "Internal bootstrap metadata for the canonical quantitative trading research platform."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantitative_trading_research*"]
namespaces = false

name: C3 E1 successor reusable exact-target validation core

on:
  workflow_call:
    inputs:
      authorization_identity:
        description: Exact owner-frozen execution authorization identity
        required: true
        type: string
      attempt_identity:
        description: Exact bounded attempt identity
        required: true
        type: string
      expected_control_sha:
        description: Exact caller/control commit SHA
        required: true
        type: string
      expected_trigger_workflow_sha256:
        description: SHA-256 of exact trigger workflow at control SHA
        required: true
        type: string
      expected_reusable_core_sha256:
        description: SHA-256 of exact reusable core at control SHA
        required: true
        type: string
      requested_target_ref:
        description: Exact governed target branch
        required: true
        type: string
      expected_target_sha:
        description: Exact governed target commit SHA
        required: true
        type: string

permissions: {}

jobs:
  c3-e1-admission:
    name: C3 E1 exact target and validation-control admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Verify owner-bound attempt caller and resolve exact target ref
        shell: bash
        env:
          C3_E1_GITHUB_TOKEN: ${{ github.token }}
          AUTHORIZATION_IDENTITY: ${{ inputs.authorization_identity }}
          ATTEMPT_IDENTITY: ${{ inputs.attempt_identity }}
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_TRIGGER_WORKFLOW_SHA256: ${{ inputs.expected_trigger_workflow_sha256 }}
          EXPECTED_REUSABLE_CORE_SHA256: ${{ inputs.expected_reusable_core_sha256 }}
          REQUESTED_TARGET_REF: ${{ inputs.requested_target_ref }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 - <<'PYADMIT'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          EXPECTED_REPOSITORY = 'racoope70/quantitative-trading-research-platform'
          EXPECTED_ATTEMPT = 'C3_E1_ATTEMPT_4_TRIGGER_DECOUPLED_EXACT_TARGET_VALIDATION'
          EXPECTED_TARGET_REF = 'c3-python-environment-dependency-reconstruction'
          EXPECTED_TARGET_SHA = 'f6798b9fe57ccdb572095d7758a48cc8d2cc55cc'
          SHA40 = re.compile(r'^[0-9a-f]{40}$')
          SHA256 = re.compile(r'^[0-9a-f]{64}$')
          API_VERSION = '2022-11-28'
          MAX_RESPONSE = 1024 * 1024

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def fail(code):
              print('control_plane_classification=' + code)
              print('empirical_E1=NOT_STARTED')
              print('Attempt_4_consumed=NO')
              raise SystemExit(2)

          repository = os.environ.get('GITHUB_REPOSITORY', '')
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          ref = os.environ.get('GITHUB_REF', '')
          head_sha = os.environ.get('GITHUB_SHA', '')
          run_attempt = os.environ.get('GITHUB_RUN_ATTEMPT', '')

          authorization_identity = os.environ.get('AUTHORIZATION_IDENTITY', '')
          attempt_identity = os.environ.get('ATTEMPT_IDENTITY', '')
          expected_control_sha = os.environ.get('EXPECTED_CONTROL_SHA', '')
          trigger_sha256 = os.environ.get('EXPECTED_TRIGGER_WORKFLOW_SHA256', '')
          core_sha256 = os.environ.get('EXPECTED_REUSABLE_CORE_SHA256', '')
          requested_target_ref = os.environ.get('REQUESTED_TARGET_REF', '')
          expected_target_sha = os.environ.get('EXPECTED_TARGET_SHA', '')
          token = os.environ.get('C3_E1_GITHUB_TOKEN', '')

          if repository != EXPECTED_REPOSITORY:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if event_name != 'workflow_dispatch':
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if ref != 'refs/heads/main':
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if run_attempt != '1':
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if attempt_identity != EXPECTED_ATTEMPT:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if (
              not authorization_identity
              or len(authorization_identity) > 512
              or '\n' in authorization_identity
              or '\r' in authorization_identity
          ):
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')

          if SHA40.fullmatch(expected_control_sha) is None:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if head_sha != expected_control_sha:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if SHA256.fullmatch(trigger_sha256) is None:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')
          if SHA256.fullmatch(core_sha256) is None:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')

          if requested_target_ref != EXPECTED_TARGET_REF:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if expected_target_sha != EXPECTED_TARGET_SHA:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if SHA40.fullmatch(expected_target_sha) is None:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if not token:
              fail('VALIDATION_INSTRUMENT_IDENTITY_FAILURE')

          encoded_ref = urllib.parse.quote(requested_target_ref, safe='')
          url = (
              'https://api.github.com/repos/'
              + repository
              + '/git/ref/heads/'
              + encoded_ref
          )
          req = urllib.request.Request(
              url,
              method='GET',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'User-Agent': 'C3-E1-successor-admission-v1',
                  'X-GitHub-Api-Version': API_VERSION,
              },
          )

          opener = urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(req, timeout=20) as response:
                  if response.status != 200:
                      fail('TARGET_IDENTITY_ADMISSION_FAILURE')
                  body = response.read(MAX_RESPONSE + 1)
          except Exception:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')

          if len(body) > MAX_RESPONSE:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')

          try:
              payload = json.loads(body.decode('utf-8', 'strict'))
          except Exception:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')

          if not isinstance(payload, dict):
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if payload.get('ref') != 'refs/heads/' + requested_target_ref:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')

          obj = payload.get('object')
          if not isinstance(obj, dict):
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if obj.get('type') != 'commit':
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')
          if obj.get('sha') != expected_target_sha:
              fail('TARGET_IDENTITY_ADMISSION_FAILURE')

          print('trigger_activation=PASS')
          print('target_ref_resolution=PASS')
          print('target_ref_resolved_sha=' + expected_target_sha)
          print('empirical_E1=NOT_STARTED')
          print('Attempt_4_consumed=NO')
          PYADMIT

      - name: Checkout exact validation control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: racoope70/quantitative-trading-research-platform
          ref: ${{ inputs.expected_control_sha }}
          path: c3-control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact governed target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: racoope70/quantitative-trading-research-platform
          ref: ${{ inputs.expected_target_sha }}
          path: c3-target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkouts and independent workflow identities
        shell: bash
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          EXPECTED_TRIGGER_WORKFLOW_SHA256: ${{ inputs.expected_trigger_workflow_sha256 }}
          EXPECTED_REUSABLE_CORE_SHA256: ${{ inputs.expected_reusable_core_sha256 }}
        run: |
          set -euo pipefail

          fail_control() {
            printf 'control_plane_classification=VALIDATION_INSTRUMENT_IDENTITY_FAILURE\n'
            printf 'empirical_E1=NOT_STARTED\n'
            printf 'Attempt_4_consumed=NO\n'
            exit 2
          }

          fail_target() {
            printf 'control_plane_classification=TARGET_IDENTITY_ADMISSION_FAILURE\n'
            printf 'empirical_E1=NOT_STARTED\n'
            printf 'Attempt_4_consumed=NO\n'
            exit 2
          }

          control_head="$(git -C c3-control rev-parse HEAD)"
          target_head="$(git -C c3-target rev-parse HEAD)"

          [ "$control_head" = "$EXPECTED_CONTROL_SHA" ] || fail_control
          [ "$target_head" = "$EXPECTED_TARGET_SHA" ] || fail_target

          trigger_path="c3-control/.github/workflows/c3-e1-attempt4.yml"
          core_path="c3-control/.github/workflows/c3-e1-successor-validation-core.yml"

          [ -f "$trigger_path" ] || fail_control
          [ ! -L "$trigger_path" ] || fail_control
          [ -f "$core_path" ] || fail_control
          [ ! -L "$core_path" ] || fail_control

          trigger_sha256="$(sha256sum "$trigger_path" | awk '{print $1}')"
          core_sha256="$(sha256sum "$core_path" | awk '{print $1}')"

          [ "$trigger_sha256" = "$EXPECTED_TRIGGER_WORKFLOW_SHA256" ] || fail_control
          [ "$core_sha256" = "$EXPECTED_REUSABLE_CORE_SHA256" ] || fail_control

          printf 'validation_control_commit_identity=PASS\n'
          printf 'trigger_workflow_identity=PASS\n'
          printf 'reusable_core_identity=PASS\n'
          printf 'target_checkout_identity=PASS\n'
          printf 'target_control_admission=PASS\n'
          printf 'empirical_E1=NOT_STARTED\n'
          printf 'Attempt_4_consumed=NO\n'

  c3-e1-bounded-empirical-observation:
    name: C3 E1 single-use bounded empirical observation candidate
    needs: c3-e1-admission
    if: ${{ needs.c3-e1-admission.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      handoff_sha256: ${{ steps.e1_observe.outputs.handoff_sha256 }}
      handoff_byte_count: ${{ steps.e1_observe.outputs.handoff_byte_count }}
    steps:
      - name: Materialize exact successor schema validator and collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/c3-e1-v4-static
          /usr/bin/python3.12 - <<'PYSRC'
          import base64, hashlib, pathlib
          root=pathlib.Path('/tmp/c3-e1-v4-static')
          items={
                      'schema.json':('','710fef3e47300123a4e612d58bb3877faa8b55e084635b5d0ce4496c9d7ddca0'),
                      'validator.py':('','5ebab28bab2e9895d398203a11fa230be05e96386063bd097b9f7bab446491bc'),
                      'collector.py':('','9468fb6204bd453295699a22c07d19fa8a03b1839e2323869c291b9a1e40a8b1')
          }
          for name,(payload,expected) in items.items():
              data=base64.b64decode(payload,validate=True)
              actual=hashlib.sha256(data).hexdigest()
              if actual!=expected:
                  raise SystemExit('MATERIALIZED_SOURCE_IDENTITY_MISMATCH:'+name)
              path=root/name
              path.write_bytes(data)
              if hashlib.sha256(path.read_bytes()).hexdigest()!=expected:
                  raise SystemExit('MATERIALIZED_SOURCE_REHASH_MISMATCH:'+name)
          print('activation_workflow_terminal_code=E1_MATERIALIZED_SOURCE_IDENTITIES_PASS')
          PYSRC

      - name: Mark admitted native E1 observation start
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ] || {
            printf 'control_plane_classification=VALIDATION_INSTRUMENT_IDENTITY_FAILURE\n'
            printf 'empirical_E1=NOT_STARTED\n'
            printf 'Attempt_4_consumed=NO\n'
            exit 2
          }
          printf 'trigger_activation=PASS\n'
          printf 'target_control_admission=PASS\n'
          printf 'empirical_E1=STARTED\n'
          printf 'Attempt_4_consumed=YES\n'

      - name: Collect and materialize exact E1 pre-finalization handoff
        id: e1_observe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf /tmp/c3-e1-v4-static/observation
          mkdir -p /tmp/c3-e1-v4-static/observation
          /usr/bin/python3.12 /tmp/c3-e1-v4-static/collector.py observe \
            --schema /tmp/c3-e1-v4-static/schema.json \
            --validator /tmp/c3-e1-v4-static/validator.py \
            --output-dir /tmp/c3-e1-v4-static/observation
          handoff=/tmp/c3-e1-v4-static/observation/C3_E1_PREFINALIZATION_HANDOFF.zip
          [ -f "$handoff" ] || {
            printf 'activation_workflow_terminal_code=E1_COLLECTION_OR_MATERIALIZATION_INCONCLUSIVE\n'
            exit 2
          }
          handoff_sha256="$(/usr/bin/sha256sum "$handoff" | /usr/bin/awk '{print $1}')"
          handoff_byte_count="$(/usr/bin/stat -c '%s' "$handoff")"
          [ "${#handoff_sha256}" = "64" ] || exit 2
          printf 'handoff_sha256=%s\n' "$handoff_sha256" >> "$GITHUB_OUTPUT"
          printf 'handoff_byte_count=%s\n' "$handoff_byte_count" >> "$GITHUB_OUTPUT"
          printf 'activation_workflow_terminal_code=E1_PREFINALIZATION_HANDOFF_READY_FOR_TRANSFER\n'

      - name: Upload exact E1 pre-finalization handoff
        id: e1_handoff_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C3_E1_PREFINALIZATION_HANDOFF
          path: /tmp/c3-e1-v4-static/observation/C3_E1_PREFINALIZATION_HANDOFF.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Fail closed on E1 pre-finalization handoff upload failure
        if: ${{ always() && steps.e1_handoff_upload.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'activation_workflow_terminal_code=E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE\n'
          printf 'activation_failure_detail=PREFINALIZATION_HANDOFF_UPLOAD_FAILED\n'
          exit 2

  c3-e1-provenance-finalization:
    name: C3 E1 provenance finalization candidate
    needs: c3-e1-bounded-empirical-observation
    if: ${{ always() && needs.c3-e1-bounded-empirical-observation.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 15
    steps:
      - name: Materialize exact successor schema validator collector and provenance resolver
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/c3-e1-v4-static
          /usr/bin/python3.12 - <<'PYSRC'
          import base64, hashlib, pathlib
          root=pathlib.Path('/tmp/c3-e1-v4-static')
          items={
                      'schema.json':('','710fef3e47300123a4e612d58bb3877faa8b55e084635b5d0ce4496c9d7ddca0'),
                      'validator.py':('','5ebab28bab2e9895d398203a11fa230be05e96386063bd097b9f7bab446491bc'),
                      'collector.py':('','9468fb6204bd453295699a22c07d19fa8a03b1839e2323869c291b9a1e40a8b1'),
                      'provenance_resolver.py':('','e64427a036666e782f015f794339bb69b2a899e9e779f326dbfb70cab6f6a47f')
          }
          for name,(payload,expected) in items.items():
              data=base64.b64decode(payload,validate=True)
              actual=hashlib.sha256(data).hexdigest()
              if actual!=expected:
                  raise SystemExit('MATERIALIZED_SOURCE_IDENTITY_MISMATCH:'+name)
              path=root/name
              path.write_bytes(data)
              if hashlib.sha256(path.read_bytes()).hexdigest()!=expected:
                  raise SystemExit('MATERIALIZED_SOURCE_REHASH_MISMATCH:'+name)
          print('activation_workflow_terminal_code=E1_MATERIALIZED_SOURCE_IDENTITIES_PASS')
          PYSRC

      - name: Download exact E1 pre-finalization handoff
        id: e1_handoff_download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: C3_E1_PREFINALIZATION_HANDOFF
          path: /tmp/c3-e1-v4-static/handoff-retrieved

      - name: Verify exact E1 pre-finalization handoff transport identity
        shell: bash
        env:
          EXPECTED_HANDOFF_SHA256: ${{ needs.c3-e1-bounded-empirical-observation.outputs.handoff_sha256 }}
          EXPECTED_HANDOFF_BYTE_COUNT: ${{ needs.c3-e1-bounded-empirical-observation.outputs.handoff_byte_count }}
        run: |
          set -euo pipefail
          handoff=/tmp/c3-e1-v4-static/handoff-retrieved/C3_E1_PREFINALIZATION_HANDOFF.zip
          [ -f "$handoff" ] || exit 2
          [ "$(find /tmp/c3-e1-v4-static/handoff-retrieved -type f | wc -l | tr -d ' ')" = "1" ] || exit 2
          actual_sha256="$(/usr/bin/sha256sum "$handoff" | /usr/bin/awk '{print $1}')"
          actual_byte_count="$(/usr/bin/stat -c '%s' "$handoff")"
          [ -n "$EXPECTED_HANDOFF_SHA256" ] || exit 2
          [ -n "$EXPECTED_HANDOFF_BYTE_COUNT" ] || exit 2
          [ "$actual_sha256" = "$EXPECTED_HANDOFF_SHA256" ] || exit 2
          [ "$actual_byte_count" = "$EXPECTED_HANDOFF_BYTE_COUNT" ] || exit 2
          printf 'activation_workflow_terminal_code=E1_PREFINALIZATION_HANDOFF_TRANSFER_IDENTITY_PASS\n'

      - name: Resolve exact completed observation job and recover setup provenance
        shell: bash
        env:
          C3_E1_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 /tmp/c3-e1-v4-static/provenance_resolver.py \
            --observation-job-name 'C3 E1 single-use bounded empirical observation candidate' \
            --output /tmp/c3-e1-v4-static/provenance.json

      - name: Build exact terminal E1 evidence from bound provenance
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf /tmp/c3-e1-v4-static/preupload
          mkdir -p /tmp/c3-e1-v4-static/preupload
          /usr/bin/python3.12 /tmp/c3-e1-v4-static/collector.py build-terminal \
            --validator /tmp/c3-e1-v4-static/validator.py \
            --handoff-zip /tmp/c3-e1-v4-static/handoff-retrieved/C3_E1_PREFINALIZATION_HANDOFF.zip \
            --provenance-json /tmp/c3-e1-v4-static/provenance.json \
            --output-dir /tmp/c3-e1-v4-static/preupload \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-head-sha "$GITHUB_SHA" \
            --expected-job-name 'C3 E1 single-use bounded empirical observation candidate'
          [ "$(find /tmp/c3-e1-v4-static/preupload -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3" ] || exit 2
          [ -f /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.zip ] || exit 2
          [ -f /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.identity.json ] || exit 2
          [ -f /tmp/c3-e1-v4-static/preupload/e1_record.seed.json ] || exit 2
          printf 'activation_workflow_terminal_code=E1_TERMINAL_EVIDENCE_MATERIALIZED_AFTER_PROVENANCE\n'

      - name: Upload exact two-file E1 terminal evidence transport
        id: e1_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C3_E1_READ_ONLY_EVIDENCE
          path: |
            /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.zip
            /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.identity.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Fail closed on E1 terminal evidence upload failure
        if: ${{ always() && steps.e1_upload.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'activation_workflow_terminal_code=E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE\n'
          printf 'activation_failure_detail=ARTIFACT_UPLOAD_FAILED\n'
          exit 2

      - name: Download exact E1 terminal evidence transport
        id: e1_download
        if: ${{ steps.e1_upload.outcome == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: C3_E1_READ_ONLY_EVIDENCE
          path: /tmp/c3-e1-v4-static/retrieved

      - name: Fail closed on E1 terminal evidence download failure
        if: ${{ always() && steps.e1_upload.outcome == 'success' && steps.e1_download.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'activation_workflow_terminal_code=E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE\n'
          printf 'activation_failure_detail=ARTIFACT_DOWNLOAD_FAILED\n'
          exit 2

      - name: Finalize retention identity and validate exact E1 terminal state
        if: ${{ steps.e1_upload.outcome == 'success' && steps.e1_download.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! /usr/bin/python3.12 /tmp/c3-e1-v4-static/collector.py finalize \
            --validator /tmp/c3-e1-v4-static/validator.py \
            --output-dir /tmp/c3-e1-v4-static/preupload \
            --retrieved-dir /tmp/c3-e1-v4-static/retrieved
          then
            exit 2
          fi

          terminal_code="$(
            /usr/bin/python3.12 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(
              Path(
                  '/tmp/c3-e1-v4-static/preupload/e1_record.final.json'
              ).read_text(encoding='utf-8')
          )
          print(record['terminal']['code'])
          PY
          )"

          case "$terminal_code" in
            E1_ALL_REQUIRED_EVIDENCE_COMPLETE)
              validator_mode='pass'
              outer_code='E1_VALIDATED_EVIDENCE_PASS'
              outer_exit=0
              ;;
            E1_RUNNER_OR_IMAGE_IDENTITY_MISMATCH|E1_SUCCESSOR_IMAGE_OBSERVED_PENDING_REVIEW|E1_IMAGE_IDENTITY_UNOBSERVABLE)
              validator_mode='nonpass'
              outer_code='E1_RUNNER_IMAGE_IDENTITY_INCOMPLETE_OR_SUCCESSOR'
              outer_exit=2
              ;;
            E1_KERNEL_IDENTITY_INCOMPLETE)
              validator_mode='nonpass'
              outer_code='E1_KERNEL_COMPLETENESS_POLICY_NOT_SATISFIED'
              outer_exit=2
              ;;
            E1_FIREWALL_REQUIRED_SCOPE_INCOMPLETE|E1_FIREWALL_OBSERVER_ARCHITECTURE_UNBOUND)
              validator_mode='nonpass'
              outer_code='E1_FIREWALL_DERIVATION_NOT_COMPLETE'
              outer_exit=2
              ;;
            E1_EVIDENCE_RETENTION_NOT_AUTHORIZED|E1_EVIDENCE_RETENTION_UNAVAILABLE)
              validator_mode='nonpass'
              outer_code='E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE'
              outer_exit=2
              ;;
            *)
              printf 'activation_workflow_terminal_code=E1_COLLECTION_OR_MATERIALIZATION_INCONCLUSIVE\n'
              exit 2
              ;;
          esac

          if ! /usr/bin/python3.12 /tmp/c3-e1-v4-static/validator.py \
            --schema /tmp/c3-e1-v4-static/schema.json \
            --record /tmp/c3-e1-v4-static/preupload/e1_record.final.json \
            --bundle /tmp/c3-e1-v4-static/retrieved/C3_E1_content_addressed_evidence_bundle.zip \
            --identity-json /tmp/c3-e1-v4-static/retrieved/C3_E1_content_addressed_evidence_bundle.identity.json \
            --validator-source /tmp/c3-e1-v4-static/validator.py \
            --mode "$validator_mode"
          then
            printf 'activation_workflow_terminal_code=E1_SEMANTIC_VALIDATION_FAILED\n'
            exit 2
          fi

          printf 'activation_workflow_terminal_code=%s\n' "$outer_code"
          exit "$outer_exit"

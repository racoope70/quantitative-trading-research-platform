  c3-e1-bounded-empirical-observation:
    name: C3 E1 single-use bounded empirical observation candidate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/c3-python-environment-dependency-reconstruction' &&
      github.event.created == false &&
      github.event.deleted == false &&
      github.event.forced == false &&
      github.event.before == 'ca70314eaeb5008b2a42e3168ef4f91722108a07' &&
      github.event.after == github.sha &&
      github.event.commits[0].id == github.sha &&
      github.event.commits[1].id == '' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 30
    steps:
      - name: Verify exact single-use E1 activation event
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/python3.12 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_before = 'ca70314eaeb5008b2a42e3168ef4f91722108a07'
          expected_ref = 'refs/heads/c3-python-environment-dependency-reconstruction'
          expected_changed = {'.github/workflows/tests.yml'}

          def fail(detail):
              print('activation_workflow_terminal_code=E1_COLLECTION_OR_MATERIALIZATION_INCONCLUSIVE')
              print('activation_failure_detail=' + detail)
              raise SystemExit(2)

          if os.environ.get('GITHUB_EVENT_NAME') != 'push':
              fail('EVENT_NOT_PUSH')
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
              fail('RUN_ATTEMPT_NOT_ONE')
          event_path = os.environ.get('GITHUB_EVENT_PATH')
          if not event_path:
              fail('EVENT_PAYLOAD_PATH_UNAVAILABLE')
          try:
              event = json.loads(Path(event_path).read_text(encoding='utf-8'))
          except Exception:
              fail('EVENT_PAYLOAD_UNREADABLE')

          if event.get('ref') != expected_ref:
              fail('UNEXPECTED_BRANCH')
          if event.get('created') is not False:
              fail('UNEXPECTED_BRANCH_CREATION')
          if event.get('deleted') is not False:
              fail('UNEXPECTED_BRANCH_DELETION')
          if event.get('forced') is not False:
              fail('FORCED_PUSH_PROHIBITED')
          if event.get('before') != expected_before:
              fail('UNEXPECTED_PREDECESSOR_COMMIT')
          if event.get('after') != os.environ.get('GITHUB_SHA'):
              fail('EVENT_AFTER_SHA_MISMATCH')
          commits = event.get('commits')
          if not isinstance(commits, list) or len(commits) != 1:
              fail('ACTIVATION_PUSH_MUST_CONTAIN_EXACTLY_ONE_COMMIT')
          commit = commits[0]
          if commit.get('id') != os.environ.get('GITHUB_SHA'):
              fail('ACTIVATION_COMMIT_SHA_MISMATCH')
          if (event.get('head_commit') or {}).get('id') != os.environ.get('GITHUB_SHA'):
              fail('HEAD_COMMIT_SHA_MISMATCH')

          changed = set()
          for key in ('added', 'modified', 'removed'):
              values = commit.get(key)
              if not isinstance(values, list):
                  fail('ACTIVATION_CHANGED_PATH_SET_UNAVAILABLE')
              for value in values:
                  if not isinstance(value, str) or not value:
                      fail('ACTIVATION_CHANGED_PATH_INVALID')
                  changed.add(value)
          if changed != expected_changed:
              fail('ACTIVATION_CHANGED_PATH_SCOPE_MISMATCH')

          print('activation_workflow_terminal_code=E1_SINGLE_USE_ACTIVATION_EVENT_PREFLIGHT_PASS')
          PY

      - name: Materialize exact successor schema validator and collector
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/c3-e1-v4-static
          /usr/bin/python3.12 - <<'PY'
          import base64, hashlib, pathlib
          root=pathlib.Path('/tmp/c3-e1-v4-static')
          items={
            'schema.json':('','710fef3e47300123a4e612d58bb3877faa8b55e084635b5d0ce4496c9d7ddca0'),
            'validator.py':('','5ebab28bab2e9895d398203a11fa230be05e96386063bd097b9f7bab446491bc'),
            'collector.py':('','376c1c9151ace3c3422c2f9d5649fbc9d5887b0c826c93fbc5b2117587ecf97c'),
          }
          failure_codes={
              'schema.json':'E1_SUCCESSOR_DESIGN_PACKAGE_IDENTITY_MISMATCH',
              'validator.py':'E1_SEMANTIC_VALIDATOR_SOURCE_IDENTITY_MISMATCH',
              'collector.py':'E1_COLLECTOR_SOURCE_IDENTITY_MISMATCH',
          }
          for name,(encoded,expected) in items.items():
              try:
                  data=base64.b64decode(encoded,validate=True)
              except Exception:
                  print('activation_workflow_terminal_code='+failure_codes[name])
                  raise SystemExit(2)
              if hashlib.sha256(data).hexdigest()!=expected:
                  print('activation_workflow_terminal_code='+failure_codes[name])
                  raise SystemExit(2)
              (root/name).write_bytes(data)
          PY
          printf 'activation_workflow_terminal_code=E1_STATIC_MATERIALIZATION_PREFLIGHT_PASS\n'

      - name: Collect and materialize exact E1 candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          rm -rf /tmp/c3-e1-v4-static/preupload
          mkdir -p /tmp/c3-e1-v4-static/preupload
          /usr/bin/python3.12 /tmp/c3-e1-v4-static/collector.py collect \
            --schema /tmp/c3-e1-v4-static/schema.json \
            --validator /tmp/c3-e1-v4-static/validator.py \
            --output-dir /tmp/c3-e1-v4-static/preupload
          printf 'activation_workflow_terminal_code=E1_PREUPLOAD_EVIDENCE_MATERIALIZED\n'

      - name: Upload exact two-file E1 evidence transport
        id: e1_upload
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C3_E1_READ_ONLY_EVIDENCE
          path: |
            /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.zip
            /tmp/c3-e1-v4-static/preupload/C3_E1_content_addressed_evidence_bundle.identity.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false

      - name: Fail closed on E1 evidence upload failure
        if: ${{ steps.e1_upload.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'activation_workflow_terminal_code=E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE\n'
          printf 'activation_failure_detail=ARTIFACT_UPLOAD_FAILED\n'
          exit 2

      - name: Download exact E1 evidence transport
        id: e1_download
        if: ${{ steps.e1_upload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: C3_E1_READ_ONLY_EVIDENCE
          path: /tmp/c3-e1-v4-static/retrieved

      - name: Fail closed on E1 evidence download failure
        if: ${{ steps.e1_upload.outcome == 'success' && steps.e1_download.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'activation_workflow_terminal_code=E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE\n'
          printf 'activation_failure_detail=ARTIFACT_DOWNLOAD_FAILED\n'
          exit 2

      - name: Finalize retention identity and validate exact E1 terminal state
        if: ${{ steps.e1_upload.outcome == 'success' && steps.e1_download.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! /usr/bin/python3.12 /tmp/c3-e1-v4-static/collector.py finalize \
            --validator /tmp/c3-e1-v4-static/validator.py \
            --output-dir /tmp/c3-e1-v4-static/preupload \
            --retrieved-dir /tmp/c3-e1-v4-static/retrieved
          then
            exit 2
          fi

          terminal_code="$(
            /usr/bin/python3.12 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(
              Path(
                  '/tmp/c3-e1-v4-static/preupload/e1_record.final.json'
              ).read_text(encoding='utf-8')
          )
          print(record['terminal']['code'])
          PY
          )"

          case "$terminal_code" in
            E1_ALL_REQUIRED_EVIDENCE_COMPLETE)
              validator_mode='pass'
              outer_code='E1_VALIDATED_EVIDENCE_PASS'
              outer_exit=0
              ;;
            E1_RUNNER_OR_IMAGE_IDENTITY_MISMATCH|E1_SUCCESSOR_IMAGE_OBSERVED_PENDING_REVIEW|E1_IMAGE_IDENTITY_UNOBSERVABLE)
              validator_mode='nonpass'
              outer_code='E1_RUNNER_IMAGE_IDENTITY_INCOMPLETE_OR_SUCCESSOR'
              outer_exit=2
              ;;
            E1_KERNEL_IDENTITY_INCOMPLETE)
              validator_mode='nonpass'
              outer_code='E1_KERNEL_COMPLETENESS_POLICY_NOT_SATISFIED'
              outer_exit=2
              ;;
            E1_FIREWALL_REQUIRED_SCOPE_INCOMPLETE|E1_FIREWALL_OBSERVER_ARCHITECTURE_UNBOUND)
              validator_mode='nonpass'
              outer_code='E1_FIREWALL_DERIVATION_NOT_COMPLETE'
              outer_exit=2
              ;;
            E1_EVIDENCE_RETENTION_NOT_AUTHORIZED|E1_EVIDENCE_RETENTION_UNAVAILABLE)
              validator_mode='nonpass'
              outer_code='E1_RETENTION_PROJECTION_OR_IDENTITY_INCOMPLETE'
              outer_exit=2
              ;;
            *)
              printf 'activation_workflow_terminal_code=E1_COLLECTION_OR_MATERIALIZATION_INCONCLUSIVE\n'
              exit 2
              ;;
          esac

          if ! /usr/bin/python3.12 /tmp/c3-e1-v4-static/validator.py \
            --schema /tmp/c3-e1-v4-static/schema.json \
            --record /tmp/c3-e1-v4-static/preupload/e1_record.final.json \
            --bundle /tmp/c3-e1-v4-static/retrieved/C3_E1_content_addressed_evidence_bundle.zip \
            --identity-json /tmp/c3-e1-v4-static/retrieved/C3_E1_content_addressed_evidence_bundle.identity.json \
            --validator-source /tmp/c3-e1-v4-static/validator.py \

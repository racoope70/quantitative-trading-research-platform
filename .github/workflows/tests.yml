                  ):
                      print(json.dumps(
                          {
                              "offline_terminal_result": "FAIL_OTHER",
                              "offline_terminal_code": "UNEXPECTED_EXCEPTION",
                          },
                          sort_keys=True,
                          separators=(",", ":"),
                      ))
                      raise SystemExit(17)
                  raise SystemExit(controlled.exit_code)
              except SystemExit:
                  print(json.dumps(
                      {
                          "offline_terminal_result": "FAIL_OTHER",
                          "offline_terminal_code": "UNEXPECTED_EXCEPTION",

                          "UNEXPECTED_EVENT",
                          "BLOCKED_IMPORT_ROOT",
                      ))
                      raise CanonicalImportBlocked(
                          "C3_BLOCKED_CANONICAL_IMPORT_ROOT"
                      )
                  return None

          def terminate_for_canonical_boundary_event() -> None:

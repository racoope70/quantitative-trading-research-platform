      - name: Acquire exact tooling artifacts from accepted package sources
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          umask 077

          unset \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
            http_proxy https_proxy all_proxy no_proxy \
            PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST PIP_FIND_LINKS

          python - "$C3_TOOL_WHEELHOUSE" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          manifest_path = Path(
              "docs/reports/C3_environment_and_dependency_manifest.yaml"
          )
          wheelhouse = Path(sys.argv[1])
          text = manifest_path.read_text(encoding="utf-8")

          if (
              "artifact_inventory_status: BOUND_GATE_2_EXECUTION"
              not in text
          ):
              raise SystemExit(
                  "FAIL_CONFIGURATION:TOOLING_ARTIFACT_INVENTORY_UNBOUND"
              )

          lines = text.splitlines()
          artifacts: list[dict[str, str]] = []
          in_artifacts = False
          current: dict[str, str] | None = None

          for line in lines:
              if line == "  artifacts:":
                  in_artifacts = True
                  continue
              if in_artifacts and line.startswith("  exact_artifact_count:"):
                  if current is not None:
                      artifacts.append(current)
                  break
              if not in_artifacts:
                  continue

              item = re.fullmatch(r"    - ([A-Za-z0-9_]+): (.+)", line)
              field = re.fullmatch(r"      ([A-Za-z0-9_]+): (.+)", line)

              if item:
                  if current is not None:
                      artifacts.append(current)
                  current = {item.group(1): item.group(2).strip('"')}
              elif field and current is not None:
                  current[field.group(1)] = field.group(2).strip('"')
              elif line.strip():
                  raise SystemExit(
                      "FAIL_CONFIGURATION:TOOLING_ARTIFACT_SCHEMA_INVALID"
                  )

          if not artifacts:
              raise SystemExit(
                  "FAIL_CONFIGURATION:TOOLING_ARTIFACT_INVENTORY_EMPTY"
              )

          required_fields = {
              "distribution",
              "version",
              "project",
              "filename",
              "simple_index_url",
              "artifact_url",
              "sha256",
          }
          for artifact in artifacts:
              if set(artifact) != required_fields:
                  raise SystemExit(
                      "FAIL_CONFIGURATION:TOOLING_ARTIFACT_FIELDS_INVALID"
                  )
              if not re.fullmatch(r"[0-9a-f]{64}", artifact["sha256"]):
                  raise SystemExit(
                      "FAIL_CONFIGURATION:TOOLING_ARTIFACT_HASH_INVALID"
                  )

          exact_count_match = re.search(
              r"(?m)^  exact_artifact_count: ([0-9]+)$",
              text,
          )
          if not exact_count_match:
              raise SystemExit(
                  "FAIL_CONFIGURATION:TOOLING_ARTIFACT_COUNT_UNBOUND"
              )
          if int(exact_count_match.group(1)) != len(artifacts):
              raise SystemExit(
                  "FAIL_CONFIGURATION:TOOLING_ARTIFACT_COUNT_MISMATCH"
              )

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(
                  self,
                  req,
                  fp,
                  code,
                  msg,
                  headers,
                  newurl,
              ):
                  return None

          context = ssl.create_default_context()
          if (
              not context.check_hostname
              or context.verify_mode != ssl.CERT_REQUIRED
          ):
              raise SystemExit(
                  "FAIL_CONFIGURATION:TLS_VERIFICATION_NOT_ENABLED"
              )

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              RejectRedirects(),
              urllib.request.HTTPSHandler(context=context),
          )

          for artifact in artifacts:
              simple = urllib.parse.urlsplit(
                  artifact["simple_index_url"]
              )
              if (
                  simple.scheme != "https"
                  or simple.hostname != "pypi.org"
                  or (simple.port or 443) != 443
                  or not simple.path.startswith("/simple/")
                  or simple.query
                  or simple.fragment
              ):
                  raise SystemExit(
                      "FAIL_PROHIBITED_SOURCE:SIMPLE_INDEX_NOT_ALLOWLISTED"
                  )

              request = urllib.request.Request(
                  artifact["simple_index_url"],
                  headers={
                      "Accept": "application/vnd.pypi.simple.v1+json",
                      "User-Agent": "C3-canonical-tooling-acquisition/1",
                  },
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit(
                              "FAIL_OTHER:SIMPLE_INDEX_HTTP_STATUS"
                          )
                      if response.geturl() != artifact["simple_index_url"]:
                          raise SystemExit(
                              "FAIL_PROHIBITED_SOURCE:SIMPLE_INDEX_REDIRECT"
                          )
                      payload = json.loads(
                          response.read().decode("utf-8")
                      )
              except urllib.error.HTTPError as exc:
                  if 300 <= exc.code < 400:
                      raise SystemExit(
                          "FAIL_PROHIBITED_SOURCE:SIMPLE_INDEX_REDIRECT"
                      ) from None
                  raise SystemExit(
                      "FAIL_OTHER:SIMPLE_INDEX_HTTP_ERROR"
                  ) from None
              except urllib.error.URLError:
                  raise SystemExit(
                      "FAIL_OTHER:SIMPLE_INDEX_NETWORK_ERROR"
                  ) from None

              matches = [
                  entry
                  for entry in payload.get("files", [])
                  if entry.get("filename") == artifact["filename"]
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      "FAIL_IDENTITY_MISMATCH:ARTIFACT_FILENAME_MATCH_COUNT"
                  )
              entry = matches[0]
              if (
                  entry.get("hashes", {}).get("sha256")
                  != artifact["sha256"]
              ):
                  raise SystemExit(
                      "FAIL_IDENTITY_MISMATCH:INDEX_HASH_MISMATCH"
                  )

              effective_url = urllib.parse.urljoin(
                  artifact["simple_index_url"],
                  entry.get("url", ""),
              )
              if effective_url != artifact["artifact_url"]:
                  raise SystemExit(
                      "FAIL_IDENTITY_MISMATCH:ARTIFACT_URL_MISMATCH"
                  )

              parsed = urllib.parse.urlsplit(effective_url)
              if (
                  parsed.scheme != "https"
                  or parsed.hostname != "files.pythonhosted.org"
                  or (parsed.port or 443) != 443
                  or not parsed.path.startswith("/packages/")
                  or Path(
                      urllib.parse.unquote(parsed.path)
                  ).name != artifact["filename"]
                  or parsed.query
                  or parsed.fragment
              ):
                  raise SystemExit(
                      "FAIL_PROHIBITED_SOURCE:ARTIFACT_URL_NOT_ALLOWLISTED"
                  )

              final_path = wheelhouse / artifact["filename"]
              partial_path = wheelhouse / (
                  f".{artifact['filename']}.partial"
              )
              digest = hashlib.sha256()

              try:
                  with opener.open(
                      urllib.request.Request(
                          effective_url,
                          headers={
                              "Accept": "application/octet-stream",
                              "User-Agent": (
                                  "C3-canonical-tooling-acquisition/1"
                              ),
                          },
                      ),
                      timeout=60,
                  ) as response:
                      if response.status != 200:
                          raise SystemExit(
                              "FAIL_OTHER:ARTIFACT_HTTP_STATUS"
                          )
                      if response.geturl() != effective_url:
                          raise SystemExit(
                              "FAIL_PROHIBITED_SOURCE:ARTIFACT_REDIRECT"
                          )
                      with partial_path.open("xb") as output:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)
                              digest.update(chunk)
                          output.flush()
                          import os
                          os.fsync(output.fileno())
              except urllib.error.HTTPError as exc:
                  if 300 <= exc.code < 400:
                      raise SystemExit(
                          "FAIL_PROHIBITED_SOURCE:ARTIFACT_REDIRECT"
                      ) from None
                  raise SystemExit(
                      "FAIL_OTHER:ARTIFACT_HTTP_ERROR"
                  ) from None
              except urllib.error.URLError:
                  raise SystemExit(
                      "FAIL_OTHER:ARTIFACT_NETWORK_ERROR"
                  ) from None

              if digest.hexdigest() != artifact["sha256"]:
                  partial_path.unlink(missing_ok=True)
                  raise SystemExit(
                      "FAIL_IDENTITY_MISMATCH:DOWNLOADED_HASH_MISMATCH"
                  )

              import os
              os.replace(partial_path, final_path)
              print(
                  "tooling_artifact_verified="
                  f"{artifact['distribution']}=={artifact['version']}"
              )

          observed = sorted(
              path.name
              for path in wheelhouse.iterdir()
              if path.is_file()
          )
          expected = sorted(item["filename"] for item in artifacts)
          if observed != expected:
              raise SystemExit(
                  "FAIL_IDENTITY_MISMATCH:WHEELHOUSE_CONTENT_MISMATCH"
              )

          (wheelhouse / "artifacts.json").write_text(
              json.dumps(
                  artifacts,
                  sort_keys=True,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          print(f"tooling_artifact_count={len(artifacts)}")
          print("tooling_acquisition_terminal_result=PASS")
          PY

      - name: Construct and verify exact tooling environment
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_CONFIG_FILE: /dev/null
          PIP_NO_INDEX: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          unset \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
            http_proxy https_proxy all_proxy no_proxy \
            PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST PIP_FIND_LINKS

          python -m venv "$C3_TOOL_VENV"

          pip_wheel="$(
            python - "$C3_TOOL_WHEELHOUSE/artifacts.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [
              item["filename"]
              for item in artifacts
              if item["distribution"] == "pip"
              and item["version"] == "26.1.2"
          ]
          if len(matches) != 1:
              raise SystemExit("PIP_WHEEL_IDENTITY_MISSING")
          print(matches[0])
          PY
          )"

          "$C3_TOOL_VENV/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "$C3_TOOL_WHEELHOUSE/$pip_wheel"

          mapfile -t remaining_wheels < <(
            python - "$C3_TOOL_WHEELHOUSE/artifacts.json" "$C3_TOOL_WHEELHOUSE" <<'PY'
          import json
          from pathlib import Path
          import sys
          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = Path(sys.argv[2])
          for item in artifacts:
              if item["distribution"] != "pip":
                  print(root / item["filename"])
          PY
          )

          "$C3_TOOL_VENV/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "${remaining_wheels[@]}"

          "$C3_TOOL_VENV/bin/python" - <<'PY'
          from importlib import metadata

          expected = {
              "pip": "26.1.2",
              "pip-tools": "7.6.0",
              "build": "1.5.0",
              "setuptools": "83.0.0",
              "wheel": "0.47.0",
              "click": "8.4.2",
              "packaging": "26.2",
              "pyproject-hooks": "1.2.0",
          }
          for name, version in expected.items():
              actual = metadata.version(name)
              if actual != version:
                  raise SystemExit(
                      f"FAIL_IDENTITY_MISMATCH:{name}_VERSION"
                  )
              print(f"tooling_identity={name}=={actual}")
          print("tooling_identity_terminal_result=PASS")
          PY

          "$C3_TOOL_VENV/bin/python" -m pip check
          printf 'tooling_pip_check_result=PASS\n'

      - name: Regenerate and compare canonical lock
        id: lock
        shell: bash
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INDEX: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          unset \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
            http_proxy https_proxy all_proxy no_proxy \
            PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST PIP_FIND_LINKS

          [ -f requirements.lock ] \
            || { printf 'FAIL_CONFIGURATION:CANONICAL_LOCK_MISSING\n'; exit 1; }

          root="$RUNNER_TEMP/c3-lock-comparison"
          rm -rf "$root"
          mkdir -p "$root/run_1" "$root/run_2"

          for run in run_1 run_2; do
            cp pyproject.toml "$root/$run/pyproject.toml"
            (
              cd "$root/$run"
              "$C3_TOOL_VENV/bin/python" -m piptools compile \
                --no-config \
                --resolver=backtracking \
                --generate-hashes \
                --strip-extras \
                --header \
                --newline=lf \
                --no-emit-index-url \
                --no-emit-trusted-host \
                --no-emit-find-links \
                --no-emit-options \
                --output-file=requirements.lock \
                pyproject.toml
            )
          done

          cmp -s \
            "$root/run_1/requirements.lock" \
            "$root/run_2/requirements.lock" \
            || { printf 'FAIL_IDENTITY_MISMATCH:CI_REPEAT_LOCK_BYTES\n'; exit 1; }

          cmp -s \
            "$root/run_1/requirements.lock" \
            requirements.lock \
            || { printf 'FAIL_IDENTITY_MISMATCH:LOCAL_CI_LOCK_BYTES\n'; exit 1; }

          lock_sha="$(sha256sum requirements.lock | awk '{print $1}')"
          manifest_sha="$(
            python - <<'PY'
          from pathlib import Path
          import re
          text = Path(
              "docs/reports/C3_environment_and_dependency_manifest.yaml"
          ).read_text(encoding="utf-8")
          match = re.search(
              r"(?m)^  canonical_checksum: ([0-9a-f]{64})$",
              text,
          )
          if not match:
              raise SystemExit("CANONICAL_LOCK_CHECKSUM_UNBOUND")
          print(match.group(1))
          PY
          )"

          [ "$lock_sha" = "$manifest_sha" ] \
            || { printf 'FAIL_IDENTITY_MISMATCH:LOCK_CHECKSUM\n'; exit 1; }

          printf 'lock_sha256=%s\n' "$lock_sha" >>"$GITHUB_OUTPUT"
          printf 'CI_repeat_lock_byte_comparison=PASS\n'
          printf 'local_to_CI_lock_byte_comparison=PASS\n'
          printf 'canonical_lock_checksum=%s\n' "$lock_sha"

      - name: Build and inspect project wheel outside repository
        id: wheel
        shell: bash
        run: |
          set -euo pipefail

          cp pyproject.toml "$C3_BUILD_SOURCE/pyproject.toml"
          cp -R src "$C3_BUILD_SOURCE/src"

          (
            cd "$C3_BUILD_SOURCE"
            "$C3_TOOL_VENV/bin/python" -m build \
              --wheel \
              --no-isolation \
              --outdir "$C3_BUILD_OUTPUT"
          )

          "$C3_TOOL_VENV/bin/python" - "$C3_BUILD_OUTPUT" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          import zipfile

          output = Path(sys.argv[1])
          wheels = sorted(output.glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("FAIL_CONFIGURATION:WHEEL_COUNT")

          wheel = wheels[0]
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit("FAIL_IDENTITY_MISMATCH:WHEEL_TAG")

          with zipfile.ZipFile(wheel) as archive:
              names = sorted(archive.namelist())
              metadata_names = [
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              ]
              wheel_names = [
                  name
                  for name in names
                  if name.endswith(".dist-info/WHEEL")
              ]
              if len(metadata_names) != 1 or len(wheel_names) != 1:
                  raise SystemExit(
                      "FAIL_CONFIGURATION:WHEEL_METADATA_COUNT"
                  )

              metadata_text = archive.read(
                  metadata_names[0]
              ).decode("utf-8")
              wheel_text = archive.read(wheel_names[0]).decode("utf-8")

          if "Name: quantitative-trading-research-platform\n" not in metadata_text:
              raise SystemExit("FAIL_IDENTITY_MISMATCH:DISTRIBUTION_NAME")
          if "Version: 0.0.0\n" not in metadata_text:
              raise SystemExit("FAIL_IDENTITY_MISMATCH:DISTRIBUTION_VERSION")
          if re.search(r"(?m)^Requires-Dist:", metadata_text):
              raise SystemExit(
                  "FAIL_IDENTITY_MISMATCH:UNEXPECTED_RUNTIME_DEPENDENCY"
              )
          if "Root-Is-Purelib: true\n" not in wheel_text:
              raise SystemExit("FAIL_IDENTITY_MISMATCH:WHEEL_NOT_PURELIB")

          normalized = {
              "filenames": names,
              "metadata": metadata_text.splitlines(),
              "wheel": wheel_text.splitlines(),
          }
          normalized_checksum = hashlib.sha256(
              json.dumps(
                  normalized,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              ).encode("utf-8")
          ).hexdigest()
          wheel_checksum = hashlib.sha256(wheel.read_bytes()).hexdigest()

          print(f"project_wheel_filename={wheel.name}")
          print(f"project_wheel_sha256={wheel_checksum}")
          print(
              "normalized_wheel_metadata_checksum="
              f"{normalized_checksum}"
          )
          print("project_wheel_inspection_result=PASS")

          Path(output / "wheel-evidence.json").write_text(
              json.dumps(
                  {
                      "filename": wheel.name,
                      "sha256": wheel_checksum,
                      "normalized_metadata_checksum": normalized_checksum,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          PY

          wheel_path="$(
            find "$C3_BUILD_OUTPUT" -maxdepth 1 -type f -name '*.whl' -print
          )"
          printf 'wheel_path=%s\n' "$wheel_path" >>"$GITHUB_OUTPUT"

      - name: Construct canonical CI environment from verified artifacts
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_CONFIG_FILE: /dev/null
          PIP_NO_INDEX: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          set -euo pipefail
          unset \
            HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY \
            http_proxy https_proxy all_proxy no_proxy \
            PIP_INDEX_URL PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST PIP_FIND_LINKS

          python -m venv "$C3_CANONICAL_VENV"

          pip_wheel="$(
            python - "$C3_TOOL_WHEELHOUSE/artifacts.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          matches = [
              item["filename"]
              for item in artifacts
              if item["distribution"] == "pip"
              and item["version"] == "26.1.2"
          ]
          if len(matches) != 1:
              raise SystemExit("PIP_WHEEL_IDENTITY_MISSING")
          print(matches[0])
          PY
          )"

          "$C3_CANONICAL_VENV/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "$C3_TOOL_WHEELHOUSE/$pip_wheel"

          mapfile -t remaining_wheels < <(
            python - "$C3_TOOL_WHEELHOUSE/artifacts.json" "$C3_TOOL_WHEELHOUSE" <<'PY'
          import json
          from pathlib import Path
          import sys
          artifacts = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          root = Path(sys.argv[2])
          for item in artifacts:
              if item["distribution"] != "pip":
                  print(root / item["filename"])
          PY
          )

          "$C3_CANONICAL_VENV/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "${remaining_wheels[@]}"

          "$C3_CANONICAL_VENV/bin/python" -m pip install \
            --require-hashes \
            --no-index \
            -r requirements.lock

          "$C3_CANONICAL_VENV/bin/python" -m pip install \
            --no-index \
            --no-deps \
            "${{ steps.wheel.outputs.wheel_path }}"

          "$C3_CANONICAL_VENV/bin/python" -m pip check
          printf 'canonical_CI_environment_construction_result=PASS\n'

      - name: Run canonical C3 operations in network-denied namespace
        shell: bash
        env:
          C3_EXPECTED_LOCK_SHA256: ${{ steps.lock.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          umask 077

          terminal_failure() {
            printf 'offline_terminal_result=%s\n' "$1"
            printf 'offline_failure_code=%s\n' "$2"
            exit 1
          }

          fail() {
            terminal_failure FAIL_CONFIGURATION "$1"
          }

          inconclusive() {
            printf 'offline_terminal_result=INCONCLUSIVE\n'
            printf 'offline_limitation_code=%s\n' "$1"
            exit 2
          }

          CANONICAL_PYTHON="$C3_CANONICAL_VENV/bin/python"
          [ -x "$CANONICAL_PYTHON" ] \
            || fail CANONICAL_PYTHON_ENTRYPOINT_INVALID
          CANONICAL_PYTHON_REAL="$(
            "$CANONICAL_PYTHON" -S -s -P -B -X utf8 -c \
              'from pathlib import Path; import sys; print(Path(sys.executable).resolve())'
          )"
          [ -f "$CANONICAL_PYTHON_REAL" ] \
            || fail CANONICAL_PYTHON_TARGET_INVALID
          [ ! -w "$CANONICAL_PYTHON_REAL" ] \
            || fail CANONICAL_PYTHON_TARGET_WRITABLE_BY_RUNNER

          set +e
          launcher_output="$(
            "$CANONICAL_PYTHON" -S -s -P -B -X utf8 - \
              "$C3_ACCEPTED_PROBE_IDENTITY_B64" \
              "${ImageOS:-}" \
              "${ImageVersion:-}" <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import sys

          SENTINEL = "UNBOUND_PENDING_INDEPENDENT_REVIEW_AND_OWNER_SELECTION"
          REQUIRED_COMMANDS = (
              "sudo",
              "unshare",
              "setpriv",
              "ip",
              "env",
              "id",
              "readlink",
              "stat",
              "sha256sum",
              "python3",
          )
          VERSION_ARGUMENTS = {
              "sudo": ("--version",),
              "unshare": ("--version",),
              "setpriv": ("--version",),
              "ip": ("-Version",),
              "env": ("--version",),
              "id": ("--version",),
              "readlink": ("--version",),
              "stat": ("--version",),
              "sha256sum": ("--version",),
              "python3": ("-S", "-s", "-P", "-B", "-X", "utf8", "--version"),
          }

          def stop(code: int) -> None:
              raise SystemExit(code)

          def main() -> None:
              if len(sys.argv) != 4:
                  stop(10)
              encoded, image_os, image_version = sys.argv[1:]
              if encoded == SENTINEL:
                  stop(12)
              try:
                  decoded = base64.b64decode(encoded, validate=True)
                  payload = json.loads(decoded.decode("utf-8"))
              except Exception:
                  stop(10)
              if set(payload) != {"schema_version", "runner_image", "commands"}:
                  stop(10)
              if payload.get("schema_version") != "C3_ACCEPTED_RUNNER_LAUNCHER_IDENTITY_V1":
                  stop(10)
              runner_image = payload.get("runner_image")
              commands = payload.get("commands")
              if not isinstance(runner_image, dict) or not isinstance(commands, dict):
                  stop(10)
              if set(runner_image) != {"identifier", "version"}:
                  stop(10)
              if runner_image["identifier"] != image_os:
                  stop(11)
              if runner_image["version"] != image_version:
                  stop(11)
              if set(commands) != set(REQUIRED_COMMANDS):
                  stop(10)

              resolved_paths: list[str] = []
              for command_name in REQUIRED_COMMANDS:
                  record = commands.get(command_name)
                  if not isinstance(record, dict):
                      stop(10)
                  if set(record) != {
                      "absolute_path",
                      "version_first_line",
                      "sha256",
                      "owner_uid",
                      "owner_gid",
                      "mode",
                      "runner_writable",
                  }:
                      stop(10)
                  if not isinstance(record["runner_writable"], bool):
                      stop(10)
                  if record["runner_writable"] is not False:
                      stop(10)
                  path_text = record["absolute_path"]
                  if not isinstance(path_text, str) or "\\n" in path_text or "\\r" in path_text:
                      stop(10)
                  path = Path(path_text)
                  if not path.is_absolute() or not path.is_file() or not os.access(path, os.X_OK):
                      stop(11)
                  file_stat = path.stat()
                  if not isinstance(record["owner_uid"], int) or not isinstance(record["owner_gid"], int):
                      stop(10)
                  if file_stat.st_uid != record["owner_uid"]:
                      stop(11)
                  if file_stat.st_gid != record["owner_gid"]:
                      stop(11)
                  current_mode = format(stat.S_IMODE(file_stat.st_mode), "o")
                  if current_mode != record["mode"]:
                      stop(11)
                  current_runner_writable = os.access(path, os.W_OK)
                  if current_runner_writable != record["runner_writable"]:
                      stop(11)
                  checksum = hashlib.sha256(path.read_bytes()).hexdigest()
                  if checksum != record["sha256"]:
                      stop(11)
                  try:
                      completed = subprocess.run(
                          [str(path), *VERSION_ARGUMENTS[command_name]],
                          stdin=subprocess.DEVNULL,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                          encoding="utf-8",
                          errors="strict",
                          env={"LANG": "C", "LC_ALL": "C"},
                          timeout=15,
                          check=False,
                      )
                  except Exception:
                      stop(12)
                  if completed.returncode != 0:
                      stop(12)
                  version_lines = completed.stdout.splitlines()
                  if not version_lines or not version_lines[0]:
                      stop(12)
                  if version_lines[0] != record["version_first_line"]:
                      stop(11)
                  resolved_paths.append(str(path))

              print("\\n".join(resolved_paths))

          try:
              main()
          except SystemExit:
              raise
          except BaseException:
              raise SystemExit(12)
          PY
          )"
          launcher_status=$?
          set -e

          case "$launcher_status" in
            0) ;;
            10) fail PROBE_LAUNCHER_CONTRACT_INVALID ;;
            11) terminal_failure FAIL_IDENTITY_MISMATCH PROBE_LAUNCHER_IDENTITY_MISMATCH ;;
            12) inconclusive PROBE_LAUNCHER_IDENTITY_UNBOUND_OR_UNCLASSIFIABLE ;;
            *) inconclusive PROBE_LAUNCHER_IDENTITY_VERIFIER_FAILURE ;;
          esac

          mapfile -t launcher_paths <<<"$launcher_output"
          [ "${#launcher_paths[@]}" -eq 10 ] \
            || fail PROBE_LAUNCHER_PATH_COUNT_MISMATCH
          SUDO="${launcher_paths[0]}"
          UNSHARE="${launcher_paths[1]}"
          SETPRIV="${launcher_paths[2]}"
          IP="${launcher_paths[3]}"
          ENV_CMD="${launcher_paths[4]}"
          ID_CMD="${launcher_paths[5]}"
          READLINK="${launcher_paths[6]}"
          STAT_CMD="${launcher_paths[7]}"
          SHA256SUM="${launcher_paths[8]}"
          PREINSTALLED_PYTHON3="${launcher_paths[9]}"
          unset launcher_output launcher_paths


          "$SUDO" -n true </dev/null \
            || inconclusive NONINTERACTIVE_SUDO_UNAVAILABLE

          original_uid="$("$ID_CMD" -u)"
          original_gid="$("$ID_CMD" -g)"
          [ "$original_uid" -ne 0 ] || fail ORIGINAL_RUNNER_UID_IS_ROOT
          [ "$original_gid" -ne 0 ] || fail ORIGINAL_RUNNER_GID_IS_ROOT

          parent_ns_before="$(
            "$READLINK" /proc/self/ns/net |
              "$SHA256SUM" |
              awk '{print $1}'
          )"

          dependency_checksum="$(
            grep -E '^  dependency_metadata_checksum: [0-9a-f]{64}$' \
              docs/reports/C3_environment_and_dependency_manifest.yaml |
              awk '{print $2}'
          )"
          [ -n "$dependency_checksum" ] \
            || fail DEPENDENCY_METADATA_CHECKSUM_UNBOUND

          HARNESS_BODY="$(
            cat <<'PY'
          import ctypes
          import errno
          import hashlib
          import http.client
          import importlib
          import importlib.util
          import io
          import json
          import os
          from pathlib import Path
          import socket
          import subprocess
          import sys
          import unittest

          class TerminalFailure(RuntimeError):
              pass

          OFFLINE_EXIT_CODES = {
              "PASS": 0,
              "FAIL_CONFIGURATION": 10,
              "FAIL_IDENTITY_MISMATCH": 11,
              "FAIL_PROHIBITED_NETWORK_ATTEMPT": 12,
              "FAIL_PROHIBITED_SECRET_EXPOSURE": 13,
              "FAIL_MISSING_PACKAGE": 14,
              "FAIL_INCOMPATIBLE_VERSION": 15,
              "FAIL_INVALID_IMPORT_TARGET": 16,
              "FAIL_OTHER": 17,
              "INCONCLUSIVE": 20,
          }

          def terminate(result: str, code: str) -> None:
              print(json.dumps(
                  {
                      "offline_terminal_result": result,
                      "offline_terminal_code": code,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ))
              exit_code = OFFLINE_EXIT_CODES.get(result)
              if exit_code is None:
                  exit_code = OFFLINE_EXIT_CODES["FAIL_OTHER"]
              raise _C3ControlledTermination(
                  _c3_control_token,
                  exit_code,
              )

          if len(sys.argv) != 9:
              terminate(
                  "FAIL_CONFIGURATION",
                  "CANONICAL_POSITIONAL_ARGUMENT_COUNT_MISMATCH",
              )
          (
              execution_phase,
              repository_root_text,
              evidence_root_text,
              parent_namespace_checksum,
              original_uid_text,
              original_gid_text,
              expected_lock_checksum,
              expected_dependency_checksum,
          ) = sys.argv[1:]
          if execution_phase != "CANONICAL_OFFLINE_EXECUTION":
              terminate(
                  "FAIL_CONFIGURATION",
                  "CANONICAL_PHASE_IDENTITY_MISMATCH",
              )
          for name, value in (
              ("PARENT_NAMESPACE", parent_namespace_checksum),
              ("LOCK", expected_lock_checksum),
              ("DEPENDENCY_METADATA", expected_dependency_checksum),
          ):
              if (
                  len(value) != 64
                  or any(character not in "0123456789abcdef" for character in value)
              ):
                  terminate(
                      "FAIL_CONFIGURATION",
                      f"{name}_CHECKSUM_INVALID",
                  )
          if not original_uid_text.isdecimal() or not original_gid_text.isdecimal():
              terminate("FAIL_CONFIGURATION", "ORIGINAL_IDENTITY_INVALID")
          original_uid = int(original_uid_text)
          original_gid = int(original_gid_text)
          if original_uid == 0 or original_gid == 0:
              terminate("FAIL_CONFIGURATION", "ORIGINAL_IDENTITY_ROOT")

          repository_root = Path(repository_root_text)
          evidence_root = Path(evidence_root_text)
          if not repository_root.is_absolute() or not repository_root.is_dir():
              terminate("FAIL_CONFIGURATION", "REPOSITORY_ROOT_INVALID")
          if not evidence_root.is_absolute() or not evidence_root.is_dir():
              terminate("FAIL_CONFIGURATION", "EVIDENCE_ROOT_INVALID")
          repository_root = repository_root.resolve()
          evidence_root = evidence_root.resolve()
          if evidence_root == repository_root or repository_root in evidence_root.parents:
              terminate("FAIL_CONFIGURATION", "EVIDENCE_ROOT_INSIDE_REPOSITORY")

          required_environment_names = {
              "HOME",
              "TMPDIR",
              "LANG",
              "LC_ALL",
              "TZ",
              "PYTHONHASHSEED",
              "PYTHONDONTWRITEBYTECODE",
              "PYTHONNOUSERSITE",
              "PYTHONSAFEPATH",
              "PYTHONUTF8",
          }
          if set(os.environ) != required_environment_names:
              terminate("FAIL_CONFIGURATION", "CHILD_ENVIRONMENT_SET_MISMATCH")
          expected_fixed_values = {
              "LANG": "C.UTF-8",
              "LC_ALL": "C.UTF-8",
              "TZ": "UTC",
              "PYTHONHASHSEED": "0",
              "PYTHONDONTWRITEBYTECODE": "1",
              "PYTHONNOUSERSITE": "1",
              "PYTHONSAFEPATH": "1",
              "PYTHONUTF8": "1",
          }
          for name, expected_value in expected_fixed_values.items():
              if os.environ[name] != expected_value:
                  terminate(
                      "FAIL_CONFIGURATION",
                      f"CHILD_ENVIRONMENT_VALUE_MISMATCH_{name}",
                  )
          for name in ("HOME", "TMPDIR"):
              value = Path(os.environ[name])
              if not value.is_absolute() or not value.is_dir():
                  terminate("FAIL_CONFIGURATION", f"CHILD_{name}_INVALID")

          if sys.flags.no_site != 1:
              terminate("FAIL_CONFIGURATION", "PYTHON_NO_SITE_MODE_NOT_SET")
          if sys.flags.no_user_site != 1:
              terminate("FAIL_CONFIGURATION", "PYTHON_NO_USER_SITE_MODE_NOT_SET")
          if not getattr(sys.flags, "safe_path", False):
              terminate("FAIL_CONFIGURATION", "PYTHON_SAFE_PATH_NOT_SET")
          if not sys.dont_write_bytecode:
              terminate("FAIL_CONFIGURATION", "PYTHON_DONT_WRITE_BYTECODE_NOT_SET")
          if sys.flags.utf8_mode != 1:
              terminate("FAIL_CONFIGURATION", "PYTHON_UTF8_MODE_NOT_SET")
          if sys.flags.hash_randomization != 0:
              terminate("FAIL_CONFIGURATION", "PYTHON_HASH_RANDOMIZATION_NOT_DISABLED")
          if "site" in sys.modules:
              terminate("FAIL_CONFIGURATION", "SITE_IMPORTED_DURING_BOOTSTRAP")

          def enumerate_open_nonstandard_descriptors() -> list[int]:
              try:
                  descriptor_names = os.listdir("/proc/self/fd")
              except OSError:
                  terminate(
                      "INCONCLUSIVE",
                      "PROC_SELF_FD_ENUMERATION_UNAVAILABLE",
                  )
              descriptors: list[int] = []
              for descriptor_name in descriptor_names:
                  if not descriptor_name.isdecimal():
                      continue
                  descriptor = int(descriptor_name)
                  if descriptor <= 2:
                      continue
                  try:
                      os.fstat(descriptor)
                  except OSError:
                      continue
                  descriptors.append(descriptor)
              return sorted(set(descriptors))

          for descriptor in enumerate_open_nonstandard_descriptors():
              try:
                  os.close(descriptor)
              except OSError:
                  pass

          if enumerate_open_nonstandard_descriptors():
              terminate(
                  "FAIL_CONFIGURATION",
                  "NONSTANDARD_FILE_DESCRIPTOR_PRESENT",
              )

          if os.getuid() == 0 or os.getgid() == 0:
              terminate("FAIL_CONFIGURATION", "CANONICAL_CODE_RUNNING_AS_ROOT")
          if os.getuid() != original_uid:
              terminate("FAIL_CONFIGURATION", "CHILD_UID_MISMATCH")
          if os.getgid() != original_gid:
              terminate("FAIL_CONFIGURATION", "CHILD_GID_MISMATCH")
          if os.getgroups():
              terminate("FAIL_CONFIGURATION", "SUPPLEMENTARY_GROUP_PRESENT")

          status_fields: dict[str, str] = {}
          try:
              status_text = Path("/proc/self/status").read_text(
                  encoding="utf-8"
              )
          except OSError:
              terminate("INCONCLUSIVE", "PROC_SELF_STATUS_UNAVAILABLE")
          for line in status_text.splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  status_fields[key] = value.strip()

          def require_four_identity_values(field: str, expected: int) -> None:
              value = status_fields.get(field)
              if value is None:
                  terminate("INCONCLUSIVE", f"PROC_STATUS_{field.upper()}_MISSING")
              parts = value.split()
              if len(parts) != 4 or any(not part.isdecimal() for part in parts):
                  terminate(
                      "INCONCLUSIVE",
                      f"PROC_STATUS_{field.upper()}_UNCLASSIFIABLE",
                  )
              if any(int(part) != expected for part in parts):
                  terminate(
                      "FAIL_CONFIGURATION",
                      f"PROC_STATUS_{field.upper()}_IDENTITY_MISMATCH",
                  )

          require_four_identity_values("Uid", original_uid)
          require_four_identity_values("Gid", original_gid)

          for capability_field in (
              "CapInh",
              "CapPrm",
              "CapEff",
              "CapBnd",
              "CapAmb",
          ):
              if status_fields.get(capability_field) != "0000000000000000":
                  terminate(
                      "FAIL_CONFIGURATION",
                      f"{capability_field.upper()}_NONZERO",
                  )
          if status_fields.get("NoNewPrivs") != "1":
              terminate("FAIL_CONFIGURATION", "NO_NEW_PRIVS_NOT_SET")

          child_ns = hashlib.sha256(
              os.readlink("/proc/self/ns/net").encode("utf-8")
          ).hexdigest()
          if child_ns == parent_namespace_checksum:
              terminate("FAIL_CONFIGURATION", "PARENT_CHILD_NAMESPACE_EQUAL")

          interfaces = sorted(path.name for path in Path("/sys/class/net").iterdir())
          if interfaces != ["lo"]:
              terminate(
                  "FAIL_CONFIGURATION",
                  "USABLE_NON_LOOPBACK_INTERFACE_PRESENT",
              )
          loopback_flags = int(
              Path("/sys/class/net/lo/flags").read_text(
                  encoding="utf-8"
              ).strip(),
              16,
          )
          if loopback_flags & 0x1:
              terminate("FAIL_CONFIGURATION", "LOOPBACK_ENABLED")

          ipv4_routes = [
              line
              for line in Path("/proc/net/route").read_text(
                  encoding="utf-8"
              ).splitlines()[1:]
              if line.strip()
          ]
          ipv6_routes = [
              line
              for line in Path("/proc/net/ipv6_route").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]
          if ipv4_routes or ipv6_routes:
              terminate("FAIL_CONFIGURATION", "ROUTE_PRESENT")

          accepted_kernel_failures = {
              errno.ENETUNREACH,
              errno.EHOSTUNREACH,
              errno.EADDRNOTAVAIL,
          }

          ipv4 = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          try:
              ipv4.settimeout(1.0)
              ipv4_result = ipv4.connect_ex(("192.0.2.1", 443))
          finally:
              ipv4.close()
          if ipv4_result == 0:
              terminate(
                  "FAIL_CONFIGURATION",
                  "C3_NET_NEG_IPV4_001_UNEXPECTED_SUCCESS",
              )
          if ipv4_result not in accepted_kernel_failures:
              terminate(
                  "INCONCLUSIVE",
                  "C3_NET_NEG_IPV4_001_UNCLASSIFIED_FAILURE",
              )

          ipv6 = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
          try:
              ipv6.settimeout(1.0)
              ipv6_result = ipv6.connect_ex(("2001:db8::1", 443))
          finally:
              ipv6.close()
          if ipv6_result == 0:
              terminate(
                  "FAIL_CONFIGURATION",
                  "C3_NET_NEG_IPV6_001_UNEXPECTED_SUCCESS",
              )
          if ipv6_result not in accepted_kernel_failures:
              terminate(
                  "INCONCLUSIVE",
                  "C3_NET_NEG_IPV6_001_UNCLASSIFIED_FAILURE",
              )

          class AuditBlocked(RuntimeError):
              pass

          class CanonicalImportBlocked(RuntimeError):
              pass

          blocked_canonical_import_roots = frozenset({
              "ctypes",
              "subprocess",
              "multiprocessing",
              "pty",
          })
          active_control: str | None = None
          canonical_import_phase_active = False
          audit_events: list[tuple[str, str]] = []

          def audit_import_root(args: tuple[object, ...]) -> str | None:
              if not args or not isinstance(args[0], str):
                  return None
              return args[0].partition(".")[0]

          def classify(event: str, args: tuple[object, ...]) -> str | None:
              if event.startswith("socket."):
                  if event == "socket.getaddrinfo":
                      return "DNS_RESOLUTION"
                  return "NETWORK_CONNECTION"
              if event == "http.client.connect":
                  return "NETWORK_CONNECTION"
              if (
                  event == "subprocess.Popen"
                  or event == "os.system"
                  or event in {"os.fork", "os.forkpty"}
                  or event.startswith("os.exec")
                  or event.startswith("os.spawn")
                  or event.startswith("os.posix_spawn")
              ):
                  return "PROCESS_CREATION_OR_REPLACEMENT"
              if event.startswith("ctypes."):
                  return "CTYPES"
              if canonical_import_phase_active and event == "import":
                  root = audit_import_root(args)
                  if root in blocked_canonical_import_roots:
                      return "BLOCKED_IMPORT_ROOT"
              return None

          def hook(event: str, args: tuple[object, ...]) -> None:
              classification = classify(event, args)
              if (
                  active_control == "C3_NET_NEG_HTTPS_001"
                  and event == "socket.getaddrinfo"
              ):
                  classification = "NETWORK_CONNECTION"
              if classification is None:
                  return
              control = active_control or "UNEXPECTED_EVENT"
              audit_events.append((control, classification))
              raise AuditBlocked(
                  f"C3_OFFLINE_AUDIT_BLOCK:{classification}"
              )

          sys.addaudithook(hook)

          def expect_block(control: str, operation, classification: str) -> None:
              nonlocal active_control
              active_control = control
              try:
                  operation()
              except AuditBlocked as exc:
                  if str(exc) != f"C3_OFFLINE_AUDIT_BLOCK:{classification}":
                      terminate(
                          "FAIL_CONFIGURATION",
                          f"{control}_WRONG_BLOCK",
                      )
              except Exception:
                  terminate(
                      "INCONCLUSIVE",
                      f"{control}_UNRELATED_FAILURE",
                  )
              else:
                  terminate(
                      "FAIL_CONFIGURATION",
                      f"{control}_NOT_BLOCKED",
                  )
              finally:
                  active_control = None

          expect_block(
              "C3_NET_NEG_DNS_001",
              lambda: socket.getaddrinfo("c3-offline-control.invalid", 443),
              "DNS_RESOLUTION",
          )
          expect_block(
              "C3_NET_NEG_HTTPS_001",
              lambda: http.client.HTTPSConnection(

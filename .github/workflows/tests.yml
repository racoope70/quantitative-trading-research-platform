                  network_boundary_result=OVERALL_PASS,
                  secret_exclusion_result=OVERALL_PASS,
              )
              if diagnostic.overall_result != OVERALL_PASS:
                  terminate(
                      diagnostic.overall_result,
                      "DIAGNOSTIC_NOT_PASS",
                  )

              write_evidence_atomic(
                  diagnostic,
                  approved_root=evidence_root,
                  basename="CI-diagnostic-evidence.json",
                  repository_root=repository_root,
              )
          except (AuditBlocked, CanonicalImportBlocked):
              terminate_for_canonical_boundary_event()

          exact_test_relative_paths = (
              "tests/config/test_settings.py",
              "tests/config/test_environment_diagnostics.py",
              "tests/environment/test_dependency_identity.py",
              "tests/environment/test_import_contract.py",
              "tests/environment/test_offline_boundary.py",
          )
          suite = unittest.TestSuite()
          for module_index, relative_path in enumerate(exact_test_relative_paths):
              test_path = repository_root / relative_path
              if not test_path.is_file():
                  terminate("FAIL_CONFIGURATION", "CANONICAL_TEST_FILE_MISSING")
              module_name = f"_c3_canonical_test_{module_index}"
              spec = importlib.util.spec_from_file_location(module_name, test_path)
              if spec is None or spec.loader is None:
                  terminate(
                      "FAIL_INVALID_IMPORT_TARGET",
                      "CANONICAL_TEST_MODULE_SPEC_INVALID",
                  )
              module = importlib.util.module_from_spec(spec)
              sys.modules[module_name] = module
              try:
                  spec.loader.exec_module(module)
                  suite.addTests(
                      unittest.defaultTestLoader.loadTestsFromModule(module)
                  )
              except (AuditBlocked, CanonicalImportBlocked):
                  terminate_for_canonical_boundary_event()
          if tuple(sys.path) != approved_sys_path:
              terminate(
                  "FAIL_CONFIGURATION",
                  "UNAPPROVED_SYS_PATH_MUTATION_BEFORE_TEST_EXECUTION",
              )
          test_output = io.StringIO()
          result = unittest.TextTestRunner(
              stream=test_output,
              verbosity=0,
              failfast=True,
              buffer=True,
          ).run(suite)
          test_summary = {
              "canonical_test_count": result.testsRun,
              "canonical_test_failure_count": len(result.failures),

      - name: Validate bounded C5 Stage A changed-file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          decision_path = (
              "docs/decisions/C5_authorization_decision.md"
          )

          if not Path(decision_path).is_file():
              print(
                  "C5 authorization decision is absent; "
                  "Stage A scope validation is not applicable."
              )
              raise SystemExit(0)

          project_lines = set(
              Path("PROJECT_CONTEXT.md").read_text(
                  encoding="utf-8"
              ).splitlines()
          )

          if (
              "current_lifecycle_state = C5_ACTIVE"
              in project_lines
          ):
              print(
                  "C5_ACTIVE is a future Stage B state; "
                  "Stage A scope validation is not applicable."
              )
              raise SystemExit(0)

          base_sha = os.environ.get(
              "BASE_SHA",
              "",
          ).strip()

          zero_sha = "0" * 40

          if not base_sha or base_sha == zero_sha:
              print(
                  "No comparison base is available; "
                  "semantic validation will continue."
              )
              raise SystemExit(0)

          subprocess.run(
              [
                  "git",
                  "cat-file",
                  "-e",
                  f"{base_sha}^{{commit}}",
              ],
              check=True,
          )

          base_contains_decision = subprocess.run(
              [
                  "git",
                  "cat-file",
                  "-e",
                  f"{base_sha}:{decision_path}",

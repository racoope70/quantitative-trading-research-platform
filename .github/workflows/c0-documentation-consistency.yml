          )
          PY

      - name: Validate future bounded C5 Stage B transition scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          project_path = Path("PROJECT_CONTEXT.md")

          project_text = project_path.read_text(
              encoding="utf-8"
          )

          def extract_leading_current_state(
              text,
              label,
          ):
              opening = "```text"
              opening_index = text.find(opening)

              if opening_index < 0:
                  raise SystemExit(
                      f"{label} is missing the leading "
                      "canonical current-state text fence."
                  )

              content_start = text.find(
                  "\n",
                  opening_index,
              )

              if content_start < 0:
                  raise SystemExit(
                      f"{label} has a malformed leading "
                      "canonical current-state text fence."
                  )

              content_start += 1

              content_end = text.find(
                  "\n```",
                  content_start,
              )

              if content_end < 0:
                  raise SystemExit(
                      f"{label} has an unterminated leading "
                      "canonical current-state text fence."
                  )

              return text[
                  content_start:content_end
              ]

          def assignment_values(
              text,
              key,
          ):
              values = []

              for raw_line in text.splitlines():
                  line = raw_line.strip()

                  if "=" not in line:
                      continue

                  lhs, rhs = line.split(
                      "=",
                      1,
                  )

                  if lhs.strip() == key:
                      values.append(
                          rhs.strip()
                      )

              return values

          head_current_state = (
              extract_leading_current_state(
                  project_text,
                  "PROJECT_CONTEXT.md",
              )
          )

          head_lifecycle_values = (
              assignment_values(
                  head_current_state,
                  "current_lifecycle_state",
              )
          )

          if len(head_lifecycle_values) != 1:
              raise SystemExit(
                  "PROJECT_CONTEXT.md leading current-state "
                  "record must contain exactly one "
                  "current_lifecycle_state assignment; "
                  f"found {head_lifecycle_values}"
              )

          head_lifecycle_state = (
              head_lifecycle_values[0]
          )

          project_lines = set(
              project_text.splitlines()
          )

          if (
              head_lifecycle_state
              != "C5_ACTIVE"
          ):
              print(
                  "Current controlling state is not "
                  "C5_ACTIVE; future Stage B scope "
                  "validation is not applicable."
              )
              raise SystemExit(0)

          base_sha = os.environ.get(
              "BASE_SHA",
              "",
          ).strip()

          zero_sha = "0" * 40

          if not base_sha or base_sha == zero_sha:
              raise SystemExit(
                  "C5 Stage B requires a comparison base."
              )

          decision_path = (
              "docs/decisions/C5_authorization_decision.md"
          )

          base_contains_decision = subprocess.run(
              [
                  "git",
                  "cat-file",
                  "-e",
                  f"{base_sha}:{decision_path}",
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          ).returncode == 0

          if not base_contains_decision:
              raise SystemExit(
                  "C5 Stage B requires GOV-DEC-0011 "
                  "already present in the comparison base."
              )

          base_project = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{base_sha}:PROJECT_CONTEXT.md",
              ],
              text=True,
          )

          base_current_state = (
              extract_leading_current_state(
                  base_project,
                  "comparison-base PROJECT_CONTEXT.md",
              )
          )

          base_lifecycle_values = (
              assignment_values(
                  base_current_state,
                  "current_lifecycle_state",
              )
          )

          if len(base_lifecycle_values) != 1:
              raise SystemExit(
                  "C5 Stage B comparison-base leading "
                  "current-state record must contain "
                  "exactly one current_lifecycle_state "
                  "assignment; "
                  f"found {base_lifecycle_values}"
              )

          base_lifecycle_state = (
              base_lifecycle_values[0]
          )

          if (
              base_lifecycle_state
              == "C5_ACTIVE"
          ):
              print(
                  "Comparison base is already C5_ACTIVE; "
                  "original Stage B transition scope "
                  "validation is not applicable."
              )
              raise SystemExit(0)

          required_stage_a_assignments = {
              "current_lifecycle_state": "C4_COMPLETED",
              "active_major_phase": "NONE",
              "authorization_effect": "NONE",
              "C5_authorization_decision_id": "GOV-DEC-0011",
              "C5_owner_decision_status": "ACCEPTED",
              "C5_activation_status": (
                  "PENDING_CANONICAL_ALIGNMENT_AND_"
                  "EXACT_POST_MERGE_VALIDATION"
              ),
              "C5_activation_precondition": (
                  "NOT_YET_SATISFIED"
              ),
              "C5_authorization_effect": (
                  "NONE__PENDING_CANONICAL_ACTIVATION"
              ),
              "C5_current_lifecycle_effect": "NONE",
              "current_authorized_workstream": "NONE",
              "next_permitted_workstream": (
                  "NONE__C5_ACTIVATION_PENDING_"
                  "CANONICAL_ALIGNMENT_AND_EXACT_"
                  "POST_MERGE_VALIDATION"
              ),
              "C6_authorization_effect": "NONE",
          }

          for (
              key,
              expected_value,
          ) in required_stage_a_assignments.items():

              controlling_values = (
                  assignment_values(
                      base_current_state,
                      key,
                  )
              )

              if (
                  controlling_values
                  != [expected_value]
              ):
                  raise SystemExit(
                      "C5 Stage B controlling Stage A "
                      "assignment mismatch for "
                      f"{key}; expected exactly "
                      f"{expected_value!r}; found "
                      f"{controlling_values!r}"
                  )

              whole_document_values = (
                  assignment_values(
                      base_project,
                      key,
                  )
              )

              contradictory_values = sorted(
                  {
                      value
                      for value
                      in whole_document_values
                      if value != expected_value
                  }
              )

              if contradictory_values:
                  raise SystemExit(
                      "C5 Stage B comparison base "
                      "contains contradictory current-state "
                      f"assignments for {key}; expected "
                      f"{expected_value!r}; contradictory "
                      f"values {contradictory_values!r}"
                  )

          print(
              "C5 Stage B structural Stage A "
              "comparison-base validation passed."
          )

          expected_paths = {
              "PROJECT_CONTEXT.md",
              "README.md",
          }

          changed = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  base_sha,
                  "HEAD",
              ],
              text=True,
          )

          changed_paths = {
              line.strip()
              for line in changed.splitlines()
              if line.strip()
          }

          if changed_paths != expected_paths:
              raise SystemExit(
                  "C5 Stage B changed-file scope mismatch; "
                  f"expected {sorted(expected_paths)}; "
                  f"found {sorted(changed_paths)}"
              )

          required_head = {
              "current_lifecycle_state = C5_ACTIVE",
              "active_major_phase = C5_DATA_SOURCE_CALENDAR_AND_INITIAL_UNIVERSE_DECISION",
              "phase_status = ACTIVE",
              "authorization_effect = C5_SCOPE_ONLY",
              "C5_authorization_decision_id = GOV-DEC-0011",
              "C5_owner_decision_status = ACCEPTED",
              "C5_activation_status = EFFECTIVE",
              "C5_activation_precondition = SATISFIED",
              "C5_authorization_effect = EFFECTIVE",
              "C5_current_lifecycle_effect = EFFECTIVE",
              "current_authorized_workstream = C5_DATA_SOURCE_CALENDAR_AND_INITIAL_UNIVERSE_DECISION",
              "next_permitted_workstream = BOUNDED_C5_DATA_SOURCE_CALENDAR_AND_INITIAL_UNIVERSE_DECISION_ONLY",
              "C6_authorization_effect = NONE",
              "dataset_generation_status = NOT_AUTHORIZED",
              "current_model_candidate = NONE",
              "current_deployment_candidate = NONE",
          }

          missing_head = sorted(
              required_head
              - project_lines
          )

          if missing_head:
              raise SystemExit(
                  "C5 Stage B head is missing "
                  "required activation-state lines: "
                  f"{missing_head}"
              )

          readme_lines = set(
              Path("README.md").read_text(
                  encoding="utf-8"
              ).splitlines()
          )

          required_readme = {
              "current_lifecycle_state = C5_ACTIVE",
              "active_major_phase = C5_DATA_SOURCE_CALENDAR_AND_INITIAL_UNIVERSE_DECISION",
              "phase_status = ACTIVE",
              "authorization_effect = C5_SCOPE_ONLY",
              "C5_activation_status = EFFECTIVE",
              "C5_activation_precondition = SATISFIED",
              "C5_current_execution_effect = EFFECTIVE",
              "C6_and_later = UNAUTHORIZED",
          }

          missing_readme = sorted(
              required_readme - readme_lines
          )

          if missing_readme:
              raise SystemExit(
                  "C5 Stage B README is missing required "
                  f"active-state lines: {missing_readme}"
              )

          stale_project_values = {
              "C5_activation_status = PENDING_CANONICAL_ALIGNMENT_AND_EXACT_POST_MERGE_VALIDATION",
              "C5_activation_precondition = NOT_YET_SATISFIED",
              "C5_authorization_effect = NONE",
              "C5_authorization_effect = NONE__PENDING_CANONICAL_ACTIVATION",
              "C5_current_lifecycle_effect = NONE",
              "current_authorized_workstream = NONE",

                                  "authorized_scope":
                                      "BOUNDED_C3_ENVIRONMENT_DEPENDENCY_CONFIGURATION_AND_OFFLINE_DIAGNOSTICS_ONLY",
                                  "decision_basis_commit":
                                      "fc360d1e57f04fb258e11821ffd3eb2c376828f2",

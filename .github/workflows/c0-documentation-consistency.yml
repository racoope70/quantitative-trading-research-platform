name: Governance Documentation Consistency

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate bounded C2 completion-alignment changed-file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          decision_path = (
              "docs/decisions/C2_completion_decision.md"
          )

          if not Path(decision_path).is_file():
              print(
                  "C2 completion decision is not present; "
                  "completion-alignment scope validation is not applicable."
              )
              raise SystemExit(0)

          base_sha = os.environ.get("BASE_SHA", "").strip()
          zero_sha = "0" * 40

          if not base_sha or base_sha == zero_sha:
              print(
                  "No comparison base is available for this event; "
                  "content and governance-state validation will continue."
              )
              raise SystemExit(0)

          subprocess.run(
              ["git", "cat-file", "-e", f"{base_sha}^{{commit}}"],
              check=True,
          )

          base_contains_decision = subprocess.run(
              [
                  "git",
                  "cat-file",
                  "-e",
                  f"{base_sha}:{decision_path}",
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          ).returncode == 0

          if base_contains_decision:
              print(
                  "The comparison base already contains the C2 completion "
                  "decision; initial completion-alignment scope validation "
                  "is not applicable."
              )
              raise SystemExit(0)

          expected_paths = {
              ".github/workflows/c0-documentation-consistency.yml",
              "PROJECT_CONTEXT.md",
              "README.md",
              "docs/decisions/C2_completion_decision.md",
              "docs/workflows/milestone_review_reference_map.md",
          }

          changed_output = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, "HEAD"],
              text=True,
          )
          changed_paths = {
              line.strip()
              for line in changed_output.splitlines()
              if line.strip()
          }

          if changed_paths != expected_paths:
              missing = sorted(expected_paths - changed_paths)
              unauthorized = sorted(changed_paths - expected_paths)
              raise SystemExit(
                  "C2 completion-alignment changed-file scope mismatch; "
                  f"missing authorized paths: {missing}; "
                  f"unauthorized changed paths: {unauthorized}"
              )

          print(
              "Exact five-file C2 completion-alignment "
              "changed-file scope passed."
          )
          PY


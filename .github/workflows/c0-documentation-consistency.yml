              }

              def collect_governed_assignments(
                  text,
                  governed_keys,
              ):
                  values = {
                      key: []
                      for key in governed_keys
                  }

                  for raw_line in text.splitlines():
                      line = raw_line.strip()

                      if "=" not in line:
                          continue

                      lhs, rhs = line.split(
                          "=",
                          1,
                      )

                      key = lhs.strip()

                      if key in governed_keys:
                          values[key].append(
                              rhs.strip()
                          )

                  return values

              def family_errors(
                  values,
                  expected,
                  required_absent,
                  label,
              ):
                  errors = []

                  for (
                      key,
                      expected_value,
                  ) in expected.items():

                      actual_values = (
                          values.get(
                              key,
                              [],
                          )
                      )

                      if not actual_values:
                          errors.append(
                              f"{label}:{key}=MISSING"
                          )
                          continue

                      actual_set = set(
                          actual_values
                      )

                      if (
                          actual_set
                          != {expected_value}
                      ):
                          errors.append(
                              f"{label}:{key}="
                              f"{sorted(actual_set)!r};"
                              f"expected={expected_value!r}"
                          )

                  for key in sorted(
                      required_absent
                  ):
                      actual_values = (
                          values.get(
                              key,
                              [],
                          )
                      )

                      if actual_values:
                          errors.append(
                              f"{label}:{key}="
                              f"{sorted(set(actual_values))!r};"
                              "expected=ABSENT"
                          )

                  return errors


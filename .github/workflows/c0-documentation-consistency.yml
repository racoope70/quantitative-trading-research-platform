              "docs/decisions/C0_governance_foundation_decision.md",
              "docs/decisions/C0_completion_decision.md",
              "docs/decisions/C1_authorization_decision.md",
              "docs/decisions/C1_completion_decision.md",
              "docs/decisions/C2_authorization_decision.md",
              "docs/decisions/C2_completion_decision.md",
              "docs/governance/repository_protection_conventions.md",

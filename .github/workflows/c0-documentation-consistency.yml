              if end == -1:
                  raise SystemExit(
                      f"C3 decision is missing section boundary: {end_heading}"
                  )

              return c3_decision_text[start:end]

          def first_text_fence(section, label):
              fence_start = section.find("```text")
              if fence_start == -1:
                  raise SystemExit(
                      f"{label} is missing its exact text inventory"
                  )

              content_start = section.find("\n", fence_start)
              fence_end = section.find("```", content_start + 1)
              if content_start == -1 or fence_end == -1:
                  raise SystemExit(
                      f"{label} contains an incomplete text inventory"

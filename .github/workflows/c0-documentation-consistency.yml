              "src/quantitative_trading_research/artifacts/README.md",
              "src/quantitative_trading_research/execution/README.md",
              "tests/README.md",
          ]

          marker_paths = [
              "src/quantitative_trading_research/__init__.py",
              "src/quantitative_trading_research/config/__init__.py",
              "src/quantitative_trading_research/data/__init__.py",
              "src/quantitative_trading_research/features/__init__.py",
              "src/quantitative_trading_research/models/__init__.py",
              "src/quantitative_trading_research/evaluation/__init__.py",
              "src/quantitative_trading_research/artifacts/__init__.py",
              "src/quantitative_trading_research/execution/__init__.py",
          ]
          marker_validation_paths = list(marker_paths)

          all_paths = principal_paths + responsibility_paths + marker_paths
          present_paths = [path for path in all_paths if Path(path).exists()]

          if not present_paths:
              print("C2 implementation package is not present; activation-only validation passed.")
              raise SystemExit(0)

          missing_paths = [path for path in all_paths if not Path(path).is_file()]
          if missing_paths:
              raise SystemExit(
                  "Partial C2 package detected; missing authorized files: "
                  f"{missing_paths}"
              )

          package_root = Path("src/quantitative_trading_research")

          project_context_path = Path("PROJECT_CONTEXT.md")
          c3_effective = False
          c4_effective = False

          def package_assignment_values(lines, key):
              prefix = f"{key} ="
              return [
                  line.split("=", 1)[1].strip()
                  for line in lines
                  if line.startswith(prefix)
              ]

          def package_exact_assignments(lines, expected):
              for key, expected_value in expected.items():
                  values = package_assignment_values(
                      lines,
                      key,
                  )
                  if not values:
                      return False
                  if any(
                      value != expected_value
                      for value in values
                  ):
                      return False
              return True

          def package_logical_values(lines, key):
              values = []
              prefix = f"{key} ="

              for index, line in enumerate(lines):
                  if line == prefix:
                      next_index = index + 1
                      while (
                          next_index < len(lines)
                          and not lines[next_index].strip()
                      ):
                          next_index += 1

                      if next_index >= len(lines):
                          values.append("")
                      else:
                          values.append(
                              lines[next_index].strip()
                          )

                  elif line.startswith(prefix):
                      values.append(
                          line.split(
                              "=",
                              1,
                          )[1].strip()
                      )

              return values

          def package_exact_logical_assignments(
              lines,
              expected,
          ):
              for key, expected_value in expected.items():
                  values = package_logical_values(
                      lines,
                      key,
                  )

                  if not values:
                      return False

                  if any(
                      value != expected_value
                      for value in values
                  ):
                      return False

              return True

          def first_text_fence_lines(path):
              text = path.read_text(
                  encoding="utf-8"
              )

              fence_token = chr(96) * 3 + "text"
              fence_start = text.find(
                  fence_token
              )

              if fence_start == -1:
                  return None

              content_start = text.find(
                  "\n",
                  fence_start,
              )

              if content_start == -1:
                  return None

              fence_end = text.find(
                  chr(96) * 3,
                  content_start + 1,
              )

              if fence_end == -1:
                  return None

              return text[
                  content_start + 1:fence_end
              ].splitlines()

          def lifecycle_position(state):
              if not state.startswith("C"):
                  return None

              phase_text, separator, status = (
                  state.partition("_")
              )

              if (
                  not separator
                  or status not in {
                      "ACTIVE",
                      "COMPLETED",
                  }
              ):
                  return None

              phase_number_text = phase_text[1:]

              if not phase_number_text.isdigit():
                  return None

              return (
                  int(phase_number_text),
                  status,
              )

          if project_context_path.is_file():
              project_context_all_lines = (

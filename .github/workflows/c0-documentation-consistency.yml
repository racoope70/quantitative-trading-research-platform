              missing_lines = [line for line in expected_lines if line not in actual_lines]
              if missing_lines:
                  raise SystemExit(f"{path} is missing required governance-state lines: {missing_lines}")

          print("Required governance files, CSV schema, and C2 completion-alignment documentary fields are consistent.")

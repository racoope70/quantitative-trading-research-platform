      - name: Validate YAML template schema and safety
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          path = "docs/templates/C1_technical_migration_manifest_template.yaml"
          raw = File.read(path, encoding: "UTF-8")
          data = YAML.safe_load(
            raw,
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )

          raise "YAML template root must be a mapping" unless data.is_a?(Hash)

          required_metadata = {
            "document_status" => "DRAFT_FOR_OWNER_REVIEW",
            "template_phase" => "C0",
            "completed_output_phase" => "C1",
            "completed_output_path" => "docs/migration/technical_migration_manifest.yaml",
            "authorization_effect" => "NONE",
            "schema_name" => "technical_migration_manifest",
            "schema_version" => "0.1-draft",
          }

          required_metadata.each do |key, expected_value|
            actual_value = data[key]
            raise "Missing or invalid YAML metadata field: #{key}" unless actual_value == expected_value
          end

          expected_required_fields = %w[
            item_id
            source_repository
            source_commit
            source_path
            asset_type
            historical_purpose
            classification
            canonical_responsibility
            migration_action
            required_changes
            known_limitations
            tests_required
            destination_path
            future_phase
            owner_disposition
          ]

          raise "YAML required_fields does not match the accepted schema" unless data["required_fields"] == expected_required_fields

          required_schema_keys = %w[
            allowed_asset_types
            allowed_classifications
            allowed_migration_actions
            allowed_owner_dispositions
            rules
            items
          ]
          missing_schema_keys = required_schema_keys.reject { |key| data.key?(key) }
          raise "Missing YAML schema fields: #{missing_schema_keys.join(', ')}" unless missing_schema_keys.empty?

          items = data["items"]
          raise "YAML items must be a non-empty array" unless items.is_a?(Array) && !items.empty?
          raise "YAML item template must be a mapping" unless items.first.is_a?(Hash)

          missing_item_fields = expected_required_fields.reject { |field| items.first.key?(field) }
          raise "YAML item template is missing fields: #{missing_item_fields.join(', ')}" unless missing_item_fields.empty?

          forbidden_raw_patterns = {
            "GitHub secret reference" => /\$\{\{\s*secrets\./i,
            "private key material" => /-----BEGIN [A-Z ]*PRIVATE KEY-----/,
            "executable command key" => /^\s*(?:run|shell|command|commands|exec|script)\s*:/i,
          }
          forbidden_raw_patterns.each do |label, pattern|
            raise "YAML template contains #{label}" if raw.match?(pattern)
          end

          forbidden_value_keys = /\A(?:password|secret|token|api[_-]?key|credential|credentials)\z/i
          walk = lambda do |node|
            case node
            when Hash
              node.each do |key, value|
                meaningful_value = !value.nil? && value != "" && value != [] && value != {}
                if key.to_s.match?(forbidden_value_keys) && meaningful_value
                  raise "YAML template contains a credential value for #{key}"
                end
                walk.call(value)
              end
            when Array
              node.each { |value| walk.call(value) }
            end
          end
          walk.call(data)

          puts "YAML syntax, schema, and safety checks passed."
          RUBY

      - name: Validate bounded C2 package structure when present
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          principal_paths = [
              "docs/architecture/C2_canonical_repository_skeleton_and_boundaries.md",
              "docs/migration/C2_migration_disposition_plan.yaml",
              "docs/reports/C2_migration_preparation_and_C3_handoff.md",
          ]

          responsibility_paths = [
              "src/quantitative_trading_research/README.md",
              "src/quantitative_trading_research/config/README.md",
              "src/quantitative_trading_research/data/README.md",
              "src/quantitative_trading_research/features/README.md",
              "src/quantitative_trading_research/models/README.md",
              "src/quantitative_trading_research/evaluation/README.md",
              "src/quantitative_trading_research/artifacts/README.md",
              "src/quantitative_trading_research/execution/README.md",
              "tests/README.md",
          ]

          marker_paths = [
              "src/quantitative_trading_research/__init__.py",
              "src/quantitative_trading_research/config/__init__.py",
              "src/quantitative_trading_research/data/__init__.py",
              "src/quantitative_trading_research/features/__init__.py",
              "src/quantitative_trading_research/models/__init__.py",
              "src/quantitative_trading_research/evaluation/__init__.py",
              "src/quantitative_trading_research/artifacts/__init__.py",
              "src/quantitative_trading_research/execution/__init__.py",
          ]

          all_paths = principal_paths + responsibility_paths + marker_paths
          present_paths = [path for path in all_paths if Path(path).exists()]

          if not present_paths:
              print("C2 implementation package is not present; activation-only validation passed.")
              raise SystemExit(0)

          missing_paths = [path for path in all_paths if not Path(path).is_file()]
          if missing_paths:
              raise SystemExit(
                  "Partial C2 package detected; missing authorized files: "
                  f"{missing_paths}"
              )

          package_root = Path("src/quantitative_trading_research")
          allowed_python_paths = {Path(path) for path in marker_paths}
          unexpected_python_paths = sorted(
              path.as_posix()
              for path in package_root.rglob("*.py")
              if path not in allowed_python_paths
          )
          if unexpected_python_paths:
              raise SystemExit(
                  "C2 contains unauthorized Python files: "
                  f"{unexpected_python_paths}"
              )

          for marker_path in marker_paths:
              path = Path(marker_path)
              raw = path.read_text(encoding="utf-8")

              if not raw.strip():
                  continue

              try:
                  tree = ast.parse(raw, filename=marker_path)
              except SyntaxError as exc:
                  raise SystemExit(
                      f"{marker_path} is not empty or a valid docstring-only module: {exc}"
                  ) from exc

              body = tree.body
              valid_docstring_only = (
                  len(body) == 1
                  and isinstance(body[0], ast.Expr)
                  and isinstance(body[0].value, ast.Constant)
                  and isinstance(body[0].value.value, str)
              )
              if not valid_docstring_only:
                  raise SystemExit(
                      f"{marker_path} must be empty or contain one module docstring only"
                  )

          markdown_requirements = {
              "docs/architecture/C2_canonical_repository_skeleton_and_boundaries.md": [
                  "# C2 Canonical Repository Skeleton and Boundaries",
                  "## Scope",
                  "## Canonical Package and Subsystems",
                  "## Responsibility Boundaries",
                  "## Dependency Direction",
                  "## Provider and Broker Boundaries",
                  "## Prohibited Coupling",
                  "## Future Phase Assignments",
                  "## Future Verification Requirements",
                  "## Non-Execution Confirmation",
              ],
              "docs/reports/C2_migration_preparation_and_C3_handoff.md": [
                  "# C2 Migration Preparation and C3 Handoff",
                  "## C2 Scope Performed",
                  "## Skeleton Summary",
                  "## All-82-Item Disposition Summary",
                  "## C3/C4 Planning Summary",
                  "## Migration-Wave Summary",
                  "## Unresolved-Limitation Summary",
                  "## C3 Handoff",
                  "## Deferred Later-Phase Responsibilities",
                  "## Evidence Limitations",
                  "## Checks Performed",
                  "## Prohibited Activity That Did Not Occur",
                  "## Completion-Condition Assessment",
                  "## C3 Non-Authorization Confirmation",
              ],
          }

          for markdown_path, required_headings in markdown_requirements.items():
              actual_lines = set(
                  Path(markdown_path).read_text(encoding="utf-8").splitlines()
              )
              missing_headings = [
                  heading for heading in required_headings
                  if heading not in actual_lines
              ]
              if missing_headings:
                  raise SystemExit(
                      f"{markdown_path} is missing required sections: "
                      f"{missing_headings}"
                  )

          responsibility_headings = [
              "## Canonical Responsibility",
              "## Permitted Future Contents",
              "## Prohibited Coupling",
              "## Dependency Direction",
              "## Responsible Future Phase",
              "## Required Future Verification",
          ]

          for responsibility_path in responsibility_paths:
              text = Path(responsibility_path).read_text(encoding="utf-8")
              lines = text.splitlines()

              if not lines or not lines[0].startswith("# "):
                  raise SystemExit(
                      f"{responsibility_path} must begin with one level-one title"
                  )

              actual_lines = set(lines)
              missing_headings = [
                  heading for heading in responsibility_headings
                  if heading not in actual_lines
              ]
              if missing_headings:
                  raise SystemExit(
                      f"{responsibility_path} is missing required sections: "
                      f"{missing_headings}"
                  )

          print(
              "Complete C2 skeleton, responsibility documents, and "
              "empty/docstring-only package markers passed structural validation."
          )
          PY

      - name: Validate bounded C2 migration-disposition schema when present
        shell: bash
        run: |
          ruby <<'RUBY'
          require "pathname"
          require "set"
          require "yaml"

          path = "docs/migration/C2_migration_disposition_plan.yaml"

          unless File.file?(path)
            puts "C2 migration-disposition plan is not present; activation-only validation passed."
            exit 0
          end

          raw = File.read(path, encoding: "UTF-8")
          data = YAML.safe_load(
            raw,
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )

          raise "C2 plan root must be a mapping" unless data.is_a?(Hash)

          accepted_manifest_path = "docs/migration/technical_migration_manifest.yaml"

          unless File.file?(accepted_manifest_path)
            raise(
              "Accepted C1 technical migration manifest is missing: "               "#{accepted_manifest_path}"
            )
          end

          accepted_manifest_raw = File.read(
            accepted_manifest_path,
            encoding: "UTF-8"
          )
          accepted_manifest = YAML.safe_load(
            accepted_manifest_raw,
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )

          unless accepted_manifest.is_a?(Hash)
            raise(
              "Accepted C1 technical migration manifest root must be a mapping"
            )
          end

          accepted_items = accepted_manifest["items"]

          unless accepted_items.is_a?(Array) && accepted_items.length == 82
            actual = (
              accepted_items.is_a?(Array) ?
              accepted_items.length :
              accepted_items.class
            )
            raise(
              "Accepted C1 technical migration manifest items must contain "               "exactly 82 records; found #{actual}"
            )
          end

          expected_top_level_keys = %w[
            items
            unresolved_limitations
          ]

          unless data.keys == expected_top_level_keys
            raise(
              "C2 plan must contain exactly these case-sensitive top-level keys " \
              "in order: #{expected_top_level_keys.join(', ')}"
            )
          end

          items = data["items"]
          limitations = data["unresolved_limitations"]

          unless items.is_a?(Array) && items.length == 82
            actual = items.is_a?(Array) ? items.length : items.class
            raise "C2 items must contain exactly 82 entries; found #{actual}"
          end

          unless limitations.is_a?(Array)
            raise "C2 unresolved_limitations must be an array"
          end

          item_keys = %w[
            c1_item_id
            source_repository
            source_commit
            source_path
            c1_classification
            canonical_responsibility
            c2_disposition
            proposed_destination_path
            migration_wave
            required_prerequisites
            required_attribution
            related_limitation_ids
            future_verification_requirements
            responsible_future_phase
            owner_selection_status
            notes
          ]

          limitation_keys = %w[
            limitation_id
            related_c1_item_ids
            source_c1_evidence
            limitation_statement
            current_status
            responsible_future_phase
            future_verification_requirements
            current_authorization_effect
            resolution_claimed_during_c2
            notes
          ]

          allowed_dispositions = Set.new(%w[
            SELECT_FOR_C3_ENVIRONMENT_ANALYSIS
            SELECT_FOR_C4_MIGRATION_PREPARATION
            DEFER_TO_C5_PROVIDER_DECISION
            DEFER_TO_C6_DATASET_CONTRACT
            DEFER_TO_C7_DATASET_GENERATION
            DEFER_TO_C8_MODEL_READINESS
            DEFER_TO_C9_PPO_QUALIFICATION
            DEFER_TO_C10_RF_GATE
            DEFER_TO_C11_XGBOOST_GATE
            DEFER_TO_C12_FINAL_HOLDOUT
            DEFER_TO_C13_PUBLICATION
            DEFER_TO_C14_PAPER_TRADING
            DEFER_TO_C15_LIVE_CONSIDERATION
            RETAIN_HISTORICAL_ONLY
            REJECT_FROM_CANONICAL_MIGRATION
            DEFER_PENDING_OWNER_DECISION
            DEFER_PENDING_IMMUTABLE_PROVENANCE
          ])

          detailed_dispositions = Set.new(%w[
            SELECT_FOR_C3_ENVIRONMENT_ANALYSIS
            SELECT_FOR_C4_MIGRATION_PREPARATION
          ])

          nonempty_string = lambda do |value|
            value.is_a?(String) && !value.strip.empty?
          end

          valid_relative_path = lambda do |value|
            next false unless nonempty_string.call(value)

            pathname = Pathname.new(value)
            !pathname.absolute? && !pathname.each_filename.to_a.include?("..")
          end

          accepted_items_by_id = {}

          accepted_items.each_with_index do |accepted_item, index|
            unless accepted_item.is_a?(Hash)
              raise(
                "Accepted C1 manifest items[#{index}] must be a mapping"
              )
            end

            accepted_item_id = accepted_item["item_id"]

            unless nonempty_string.call(accepted_item_id)
              raise(
                "Accepted C1 manifest items[#{index}].item_id must be non-empty"
              )
            end

            if accepted_items_by_id.key?(accepted_item_id)
              raise(
                "Accepted C1 manifest contains duplicate item_id "                 "#{accepted_item_id}"
              )
            end

            accepted_items_by_id[accepted_item_id] = accepted_item
          end

          item_ids = []
          limitation_ids = []
          source_identities = []

          items.each_with_index do |item, index|
            raise "items[#{index}] must be a mapping" unless item.is_a?(Hash)

            unless item.keys == item_keys
              raise(
                "items[#{index}] must contain exactly the normalized keys: " \
                "#{item_keys.join(', ')}"
              )
            end

            item_id = item["c1_item_id"]
            raise "items[#{index}].c1_item_id must be non-empty" unless nonempty_string.call(item_id)
            item_ids << item_id

            %w[
              source_repository
              c1_classification
              canonical_responsibility
              responsible_future_phase
              owner_selection_status
            ].each do |key|
              unless nonempty_string.call(item[key])
                raise "items[#{index}].#{key} must be non-empty"
              end
            end

            commit = item["source_commit"]
            unless commit.is_a?(String) && commit.match?(/\A[0-9a-f]{40}\z/)
              raise "items[#{index}].source_commit must be a full lowercase 40-character commit"
            end

            source_path = item["source_path"]
            unless valid_relative_path.call(source_path)
              raise "items[#{index}].source_path must be a safe relative path"
            end

            disposition = item["c2_disposition"]
            unless allowed_dispositions.include?(disposition)
              raise "items[#{index}].c2_disposition is not an accepted value"
            end

            %w[
              required_prerequisites
              related_limitation_ids
              future_verification_requirements
            ].each do |key|
              raise "items[#{index}].#{key} must be an array" unless item[key].is_a?(Array)
            end

            unless item["related_limitation_ids"].all? { |value| nonempty_string.call(value) }
              raise "items[#{index}].related_limitation_ids contains an invalid ID"
            end

            unless item["future_verification_requirements"].all? { |value| nonempty_string.call(value) }
              raise "items[#{index}].future_verification_requirements contains an invalid entry"
            end

            if item["future_verification_requirements"].empty?
              raise "items[#{index}].future_verification_requirements must not be empty"
            end

            if detailed_dispositions.include?(disposition)
              unless valid_relative_path.call(item["proposed_destination_path"])
                raise(
                  "items[#{index}] requires a safe proposed_destination_path " \
                  "for its C3/C4 disposition"
                )
              end

              unless nonempty_string.call(item["migration_wave"])
                raise "items[#{index}] requires migration_wave planning"
              end
            end

            source_identities << [
              item["source_repository"],
              item["source_commit"],
              item["source_path"],
            ]
          end

          if item_ids.uniq.length != item_ids.length
            raise "C2 plan contains duplicate c1_item_id values"
          end

          accepted_item_id_set = accepted_items_by_id.keys.to_set
          c2_item_id_set = item_ids.to_set

          unless c2_item_id_set == accepted_item_id_set
            missing_ids = (
              accepted_item_id_set - c2_item_id_set
            ).to_a.sort
            additional_ids = (
              c2_item_id_set - accepted_item_id_set
            ).to_a.sort

            raise(
              "C2 c1_item_id set differs from the accepted C1 manifest "               "item_id set; missing accepted item IDs: #{missing_ids}; "               "additional or invented C2 item IDs: #{additional_ids}"
            )
          end

          identity_field_map = {
            "source_repository" => "source_repository",
            "source_commit" => "source_commit",
            "source_path" => "source_path",
            "c1_classification" => "classification",
            "canonical_responsibility" => "canonical_responsibility",
          }

          items.each do |item|
            item_id = item["c1_item_id"]
            accepted_item = accepted_items_by_id.fetch(item_id)

            identity_field_map.each do |c2_field, c1_field|
              next if item[c2_field] == accepted_item[c1_field]

              raise(
                "C2 identity mismatch for item #{item_id}, "                 "field #{c2_field} (accepted C1 field #{c1_field}): "                 "C2=#{item[c2_field].inspect}; "                 "C1=#{accepted_item[c1_field].inspect}"
              )
            end
          end

          if source_identities.uniq.length != source_identities.length
            raise "C2 plan contains duplicate immutable source identities"
          end

          limitations.each_with_index do |limitation, index|
            unless limitation.is_a?(Hash)
              raise "unresolved_limitations[#{index}] must be a mapping"
            end

            unless limitation.keys == limitation_keys
              raise(
                "unresolved_limitations[#{index}] must contain exactly the " \
                "normalized keys: #{limitation_keys.join(', ')}"
              )
            end

            limitation_id = limitation["limitation_id"]
            unless nonempty_string.call(limitation_id)
              raise "unresolved_limitations[#{index}].limitation_id must be non-empty"
            end
            limitation_ids << limitation_id

            %w[
              limitation_statement
              responsible_future_phase
            ].each do |key|
              unless nonempty_string.call(limitation[key])
                raise "unresolved_limitations[#{index}].#{key} must be non-empty"
              end
            end

            %w[
              related_c1_item_ids
              source_c1_evidence
              future_verification_requirements
            ].each do |key|
              unless limitation[key].is_a?(Array)
                raise "unresolved_limitations[#{index}].#{key} must be an array"
              end

              unless limitation[key].all? { |value| nonempty_string.call(value) }
                raise "unresolved_limitations[#{index}].#{key} contains an invalid entry"
              end

              if limitation[key].empty?
                raise "unresolved_limitations[#{index}].#{key} must not be empty"
              end
            end

            unless limitation["current_status"] == "UNRESOLVED"
              raise "unresolved_limitations[#{index}].current_status must be UNRESOLVED"
            end

            unless limitation["current_authorization_effect"] == "NONE"
              raise(
                "unresolved_limitations[#{index}].current_authorization_effect " \
                "must be NONE"
              )
            end

            unless limitation["resolution_claimed_during_c2"] == "NO"
              raise(
                "unresolved_limitations[#{index}].resolution_claimed_during_c2 " \
                "must be the string NO"
              )
            end
          end

          if limitation_ids.uniq.length != limitation_ids.length
            raise "C2 plan contains duplicate limitation_id values"
          end

          item_id_set = item_ids.to_set
          limitation_id_set = limitation_ids.to_set

          items.each_with_index do |item, index|
            item["related_limitation_ids"].each do |limitation_id|
              unless limitation_id_set.include?(limitation_id)
                raise(
                  "items[#{index}] references unknown limitation_id " \
                  "#{limitation_id}"
                )
              end

              matching_limitation = limitations.find do |entry|
                entry["limitation_id"] == limitation_id
              end

              unless matching_limitation["related_c1_item_ids"].include?(item["c1_item_id"])
                raise(
                  "Bidirectional reference missing: #{limitation_id} does not " \
                  "reference #{item['c1_item_id']}"
                )
              end
            end
          end

          limitations.each_with_index do |limitation, index|
            limitation["related_c1_item_ids"].each do |item_id|
              unless item_id_set.include?(item_id)
                raise(
                  "unresolved_limitations[#{index}] references unknown " \
                  "c1_item_id #{item_id}"
                )
              end

              matching_item = items.find do |entry|
                entry["c1_item_id"] == item_id
              end

              unless matching_item["related_limitation_ids"].include?(limitation["limitation_id"])
                raise(
                  "Bidirectional reference missing: #{item_id} does not " \
                  "reference #{limitation['limitation_id']}"
                )
              end
            end
          end

          puts(
            "C2 migration-disposition YAML passed exact schema, 82-item, " \
            "identity, fixed-value, and bidirectional-reference validation."
          )
          RUBY

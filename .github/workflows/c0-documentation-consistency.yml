              print(
                  "The comparison base already contains "
                  "GOV-DEC-0011; initial Stage A scope "
                  "validation is not applicable."
              )
              raise SystemExit(0)

          expected_paths = {
              ".github/workflows/c0-documentation-consistency.yml",
              "PROJECT_CONTEXT.md",
              "README.md",
              "docs/decisions/C5_authorization_decision.md",

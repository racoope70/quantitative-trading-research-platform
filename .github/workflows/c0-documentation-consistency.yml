          def assignment_values(lines, key):
              prefix = f"{key} ="
              return [
                  line.split("=", 1)[1].strip()
                  for line in lines
                  if line.startswith(prefix)
              ]

          def require_exact_assignments(label, lines, expected):
              for key, expected_value in expected.items():
                  values = assignment_values(lines, key)
                  if not values:
                      raise SystemExit(
                          f"{label} is missing required assignment "
                          f"{key} = {expected_value}"
                      )

                  contradictory_values = sorted(
                      {
                          value
                          for value in values
                          if value != expected_value
                      }
                  )
                  if contradictory_values:
                      raise SystemExit(
                          f"{label} contains contradictory assignments "
                          f"for {key}; expected {expected_value!r}, "
                          f"found {sorted(set(values))!r}"
                      )

          def logical_assignment_values(lines, key):
              values = []
              prefix = f"{key} ="

              for index, line in enumerate(lines):
                  if line == prefix:
                      next_index = index + 1
                      while (
                          next_index < len(lines)
                          and not lines[next_index].strip()
                      ):
                          next_index += 1

                      if next_index >= len(lines):
                          values.append("")
                      else:
                          values.append(
                              lines[next_index].strip()
                          )
                  elif line.startswith(prefix):
                      values.append(
                          line.split("=", 1)[1].strip()
                      )

              return values

          def require_exact_logical_assignment(
              label,
              lines,
              key,
              expected_value,
          ):
              values = logical_assignment_values(lines, key)

              if not values:
                  raise SystemExit(
                      f"{label} is missing logical assignment for {key}"
                  )

              contradictory_values = sorted(
                  {
                      value
                      for value in values
                      if value != expected_value
                  }
              )
              if contradictory_values:
                  raise SystemExit(
                      f"{label} contains contradictory logical "
                      f"assignments for {key}; "
                      f"expected {expected_value!r}, "
                      f"found {sorted(set(values))!r}"
                  )

          def first_text_fence_lines(section, label):
              fence_start = section.find("```text")
              if fence_start == -1:
                  raise SystemExit(
                      f"{label} is missing its text record"
                  )

              content_start = section.find("\n", fence_start)
              fence_end = section.find(
                  "```",
                  content_start + 1,
              )
              if content_start == -1 or fence_end == -1:
                  raise SystemExit(
                      f"{label} contains an incomplete text record"
                  )

              return section[
                  content_start + 1:fence_end
              ].splitlines()

          def bounded_markdown_section(
              text,
              start_heading,
              end_heading,
              label,
          ):
              start_marker = start_heading + "\n"
              start = text.find(start_marker)
              if start == -1:
                  raise SystemExit(
                      f"{label} is missing start heading: {start_heading}"
                  )
              if text.find(
                  start_marker,
                  start + len(start_marker),
              ) != -1:
                  raise SystemExit(
                      f"{label} contains duplicate start heading: "
                      f"{start_heading}"
                  )

              if end_heading is None:
                  end = len(text)
              else:
                  end_marker = end_heading + "\n"
                  end = text.find(
                      end_marker,
                      start + len(start_marker),
                  )
                  if end == -1:
                      raise SystemExit(
                          f"{label} is missing end heading: {end_heading}"
                      )
                  if text.find(
                      end_marker,
                      end + len(end_marker),
                  ) != -1:
                      raise SystemExit(
                          f"{label} contains duplicate end heading: "
                          f"{end_heading}"
                      )

              return text[start:end]


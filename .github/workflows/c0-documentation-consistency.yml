      - name: Validate YAML template schema and safety
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"

          path = "docs/templates/C1_technical_migration_manifest_template.yaml"
          raw = File.read(path, encoding: "UTF-8")
          data = YAML.safe_load(
            raw,
            permitted_classes: [],
            permitted_symbols: [],
            aliases: false
          )

          raise "YAML template root must be a mapping" unless data.is_a?(Hash)

          required_metadata = {
            "document_status" => "DRAFT_FOR_OWNER_REVIEW",
            "template_phase" => "C0",
            "completed_output_phase" => "C1",
            "completed_output_path" => "docs/migration/technical_migration_manifest.yaml",
            "authorization_effect" => "NONE",
            "schema_name" => "technical_migration_manifest",
            "schema_version" => "0.1-draft",
          }

          required_metadata.each do |key, expected_value|
            actual_value = data[key]
            raise "Missing or invalid YAML metadata field: #{key}" unless actual_value == expected_value
          end

          expected_required_fields = %w[
            item_id
            source_repository
            source_commit
            source_path
            asset_type
            historical_purpose
            classification
            canonical_responsibility
            migration_action
            required_changes
            known_limitations
            tests_required
            destination_path
            future_phase
            owner_disposition
          ]

          raise "YAML required_fields does not match the accepted schema" unless data["required_fields"] == expected_required_fields

          required_schema_keys = %w[
            allowed_asset_types
            allowed_classifications
            allowed_migration_actions
            allowed_owner_dispositions
            rules
            items
          ]
          missing_schema_keys = required_schema_keys.reject { |key| data.key?(key) }
          raise "Missing YAML schema fields: #{missing_schema_keys.join(', ')}" unless missing_schema_keys.empty?

          items = data["items"]
          raise "YAML items must be a non-empty array" unless items.is_a?(Array) && !items.empty?
          raise "YAML item template must be a mapping" unless items.first.is_a?(Hash)

          missing_item_fields = expected_required_fields.reject { |field| items.first.key?(field) }
          raise "YAML item template is missing fields: #{missing_item_fields.join(', ')}" unless missing_item_fields.empty?

          forbidden_raw_patterns = {
            "GitHub secret reference" => /\$\{\{\s*secrets\./i,
            "private key material" => /-----BEGIN [A-Z ]*PRIVATE KEY-----/,
            "executable command key" => /^\s*(?:run|shell|command|commands|exec|script)\s*:/i,
          }
          forbidden_raw_patterns.each do |label, pattern|
            raise "YAML template contains #{label}" if raw.match?(pattern)
          end

          forbidden_value_keys = /\A(?:password|secret|token|api[_-]?key|credential|credentials)\z/i
          walk = lambda do |node|
            case node
            when Hash
              node.each do |key, value|
                meaningful_value = !value.nil? && value != "" && value != [] && value != {}
                if key.to_s.match?(forbidden_value_keys) && meaningful_value
                  raise "YAML template contains a credential value for #{key}"
                end
                walk.call(value)
              end
            when Array
              node.each { |value| walk.call(value) }
            end
          end
          walk.call(data)

          puts "YAML syntax, schema, and safety checks passed."
          RUBY

      - name: Validate bounded C2 package structure when present
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          principal_paths = [
              "docs/architecture/C2_canonical_repository_skeleton_and_boundaries.md",
              "docs/migration/C2_migration_disposition_plan.yaml",

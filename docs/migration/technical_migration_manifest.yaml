  - item_id: C1-TM-006
    source_repository: racoope70/ppo-trading-pipeline
    source_commit: 072103f43d8b2488c3efca183f637ab0508a193a
    source_path: src/train.py
    asset_type: SOURCE_MODULE
    historical_purpose: Provide modular PPO training, chronological evaluation, safe-feature environments, artifact persistence, and run summaries.

document_status: DRAFT_FOR_OWNER_REVIEW
template_phase: C0
completed_output_phase: C1
completed_output_path: docs/migration/technical_migration_manifest.yaml
authorization_effect: NONE
schema_name: technical_migration_manifest
schema_version: "0.1-draft"

required_fields:
  - item_id
  - source_repository
  - source_commit
  - source_path
  - asset_type
  - historical_purpose
  - classification
  - canonical_responsibility
  - migration_action
  - required_changes
  - known_limitations
  - tests_required
  - destination_path
  - future_phase
  - owner_disposition

allowed_asset_types:
  - SOURCE_MODULE
  - TEST_MODULE
  - CONFIGURATION
  - NOTEBOOK
  - SCRIPT
  - DATA_ARTIFACT
  - MODEL_ARTIFACT
  - BROKER_SAFETY_COMPONENT
  - PROVENANCE_UTILITY
  - BUILD_OR_CI_COMPONENT
  - OTHER_TECHNICAL_ASSET

allowed_classifications:
  - CARRY_FORWARD
  - SUMMARIZE_AND_REFERENCE
  - HISTORICAL_ARCHIVE_ONLY
  - OBSOLETE_OR_SUPERSEDED

allowed_migration_actions:
  - COPY_WITH_ATTRIBUTION
  - REIMPLEMENT_WITH_ATTRIBUTION
  - ADAPT_AND_TEST
  - SUMMARIZE_AND_REFERENCE
  - RETAIN_IN_HISTORICAL_REPOSITORY
  - EXCLUDE_FROM_NEW_REPOSITORY
  - DEFER_DECISION

allowed_owner_dispositions:
  - PENDING
  - ACCEPTED
  - ACCEPTED_WITH_CORRECTIONS
  - DEFERRED
  - REJECTED

rules:
  - Use immutable full source commit SHAs.
  - Historical repositories must not become runtime dependencies.
  - Historical authorization has no effect in the new repository.
  - Historical artifacts do not become current candidates through migration.
  - C1 recommends migration but does not execute it.
  - Executable migration begins only after the canonical environment exists.
  - Run records, reviews, audits, decisions, results, and governance records belong in the evidence retention matrix.

items:
  - item_id: C1-TM-001
    source_repository: racoope70/exploratory-daytrading
    source_commit: 2d6f354451515ff07ff6d022ea989ade2bc7574a
    source_path: Feature_Engineering_Trading.ipynb
    asset_type: NOTEBOOK
    historical_purpose: Explore technical indicators, named leakage exclusions, Random Forest fitting, and preliminary evaluation.
    classification: CARRY_FORWARD
    canonical_responsibility: Preserve feature-definition provenance and leakage-safe transformation requirements.
    migration_action: REIMPLEMENT_WITH_ATTRIBUTION
    required_changes:
    - Remove Colab, Google Drive, installation, and environment-repair cells.
    - Define explicit input and output schemas.
    - Separate feature construction from model training and evaluation.
    - Use train-fitted transformations only.
    - Replace randomized train_test_split with chronological or walk-forward partitioning.
    - Define embargo or gap rules where feature and target horizons require them.
    - Do not carry the historical split implementation forward directly.
    known_limitations:
    - Randomized 70/30 train/test split on time-series observations.
    - No explicit chronological boundary and no shuffle=False.
    - Hard-coded paths and unstable RAPIDS environment.
    - Incomplete proof of feature-timing safety.
    - Notebook coupling of data, features, training, and evaluation.
    tests_required:
    - Feature-window unit tests.
    - Split-order and chronological-boundary tests.
    - Walk-forward partition tests.
    - No-lookahead and embargo or horizon-overlap tests.
    - Null and infinity handling tests.
    - Deterministic feature-output and schema tests.
    destination_path: null
    future_phase: C4_SELECTED_CODE_MIGRATION_ADAPTATION_AND_VERIFICATION
    owner_disposition: PENDING

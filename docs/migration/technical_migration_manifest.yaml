    canonical_responsibility: Preserve PPO training responsibilities as design input for a governed reimplementation.
    migration_action: REIMPLEMENT_WITH_ATTRIBUTION
    required_changes:
    - Propagate frozen train fraction, embargo, minimum-row values, and random seed into every training call.
    - Record configured and applied values and fail closed on mismatch.
    - Use the dedicated VecNormalize copy-and-lock helper and assert evaluation normalization remains locked.
    - Replace best-Sharpe-only and top-N retention.
    - Bind runs to immutable dataset, configuration, code, feature, seed, environment, and artifact identities.
    - Keep final holdout outside the training function.
    known_limitations:
    - Configured embargo was not applied.
    - Several split values were hard-coded rather than propagated.
    - Configuration-to-execution alignment was incomplete.
    - Direct normalization-stat assignment was used instead of the stronger helper.
    - Top-N windows were ranked by Sharpe.
    - Historical provider and path assumptions remain.
    tests_required:
    - Configuration-propagation and mismatch tests.
    - Chronological split and embargo tests.
    - VecNormalize copy, lock, and mutation tests.
    - Seed-determinism tests.
    - Artifact-identity tests.
    - No-final-holdout-access tests.
